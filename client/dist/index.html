<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <meta name="description" content="Job management, tasks, deliveries and fuel logging for Contact Computers" />
  <meta name="theme-color" content="#1a6bd8" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <script>
    tailwind.config = {

      theme: {
        extend: {
          colors: {
            brand: { 50:'#eef5ff',100:'#dcebff',200:'#bddaff',300:'#8cc0fb',400:'#559df5',500:'#2580f0',600:'#1a6bd8',700:'#1656ae',800:'#17498c',900:'#183f73' }
          }
        }
      }
    }
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-variant-numeric: tabular-nums; }
    .font-display { font-family: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif; font-weight: 600; letter-spacing: .01em; }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    .sig-canvas { touch-action: none; border: 2px dashed #8cc0fb; border-radius: 8px; background: #fff; }
    .status-open { background: #dbeafe; color: #1e40af; }
    .status-in_progress { background: #fef3c7; color: #92400e; }
    .status-closed { background: #d1fae5; color: #065f46; }
    .status-pending { background: #e0e7ff; color: #3730a3; }
    .status-completed { background: #d1fae5; color: #065f46; }
    .priority-high { color: #dc2626; font-weight: 600; }
    .priority-normal { color: #94a3b8; }
    .priority-low { color: #6b7280; }
    .card { background: #fff; border-radius: 14px; border: 1px solid #e3e9f2; box-shadow: 0 1px 2px rgba(15,35,70,.04); }
    .card-raised { border-color: #cfe0f8; box-shadow: 0 2px 4px rgba(15,35,70,.05), 0 12px 28px -12px rgba(26,107,216,.28); }
    .job-card { border-left-width: 4px; border-left-color: #cbd5e1; }
    .job-edge-open { border-left-color: #2580f0; }
    .job-edge-in_progress { border-left-color: #f59e0b; }
    .job-edge-closed { border-left-color: #10b981; }
    .job-edge-pending { border-left-color: #6366f1; }
    .nav-active { background: #1a6bd8; color: white; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0.5rem 1rem; border-radius: 10px; font-weight: 600; font-size: 0.875rem; transition: all .15s; }
    .btn-primary { background: #1a6bd8; color: white; }
    .btn-primary:hover, .btn-primary:active { background: #1656ae; }
    .btn-secondary { background: #eaf0f8; color: #26364d; }
    .btn-secondary:hover, .btn-secondary:active { background: #dbe5f2; }
    .btn-danger { background: #fee2e2; color: #b91c1c; }
    .btn-success { background: #d1fae5; color: #065f46; }
    .input { width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #d3dbe7; border-radius: 10px; background: #fff; font-size: 0.875rem; }
    .input:focus { outline: none; border-color: #1a6bd8; box-shadow: 0 0 0 3px rgba(26,107,216,.16); }
    .label { display: block; font-size: 0.75rem; font-weight: 500; color: #4b5563; margin-bottom: 0.25rem; }
    .modal-bg {
      background: rgba(0,0,0,.45);
      overscroll-behavior: none;
      touch-action: none;
      -webkit-overflow-scrolling: none;
    }
    .modal-panel {
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
    }
    body.modal-open {
      overflow: hidden !important;
      position: fixed !important;
      width: 100% !important;
      left: 0;
      right: 0;
      touch-action: none;
    }
    html.modal-open {
      overflow: hidden !important;
    }
    #calendar-grid .day-cell { min-height: 80px; }
    .task-chip { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; margin: 1px 0; cursor: grab; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .spinner { border: 2px solid #e5e7eb; border-top-color: #1a6bd8; border-radius: 50%; width: 24px; height: 24px; animation: spin .6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast { position: fixed; bottom: calc(100px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); z-index: 100; padding: 10px 20px; border-radius: 8px; color: white; font-size: 0.875rem; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
  </style>
</head>
<body class="bg-[#f3f6fb] text-slate-800 min-h-screen">
  <div id="app"></div>
  <div id="toast" class="toast hidden"></div>

  <script>
    const API = '';
    let state = {
      user: null,
      token: localStorage.getItem('jc_token') || null,
      view: 'dashboard',
      data: {},
      loading: false,
      modal: null,
      calendarMonth: new Date(),
      fuelMonth: new Date().toISOString().slice(0, 7),
      filters: {},
      selectedJob: null
    };

    // ---------- ICONS (inline line icons, one stroke weight) ----------
    const ICON_PATHS = {
      'home': '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
      'jobs': '<rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/>',
      'calendar': '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
      'fuel': '<line x1="3" x2="15" y1="22" y2="22"/><line x1="4" x2="14" y1="9" y2="9"/><path d="M14 22V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v18"/><path d="M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 2 2a2 2 0 0 0 2-2V9.83a2 2 0 0 0-.59-1.42L18 5"/>',
      'menu': '<line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/>',
      'package': '<path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',
      'users': '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
      'user': '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
      'file-text': '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
      'pen': '<path d="M12 20h9"/><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"/>',
      'phone': '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>',
      'map-pin': '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
      'chevron-left': '<path d="m15 18-6-6 6-6"/>',
      'chevron-right': '<path d="m9 18 6-6-6-6"/>',
      'log-out': '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>',
      'x': '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
      'flag': '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/>',
      'check-circle': '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/>',
      'plus': '<path d="M5 12h14"/><path d="M12 5v14"/>'
    };
    function icon(name, cls = 'w-6 h-6', sw = 2) {
      return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[name] || ''}</svg>`;
    }

    // ---------- ADDRESS SEARCH + MAPS ----------
    // Suggestions come from Photon, a free OpenStreetMap-based address search (no API key).
    // Typing a free-text address always still works if the lookup is slow or offline.
    const ADDRESS_SEARCH = {
      url: 'https://photon.komoot.io/api/',
      bbox: '16.3,-35.0,33.0,-22.0', // South Africa: west,south,east,north. Remove to search worldwide.
      minChars: 3,
      delayMs: 400
    };

    function formatPhotonAddress(f) {
      const p = (f && f.properties) || {};
      const street = p.street || '';
      const streetLine = p.housenumber && street ? p.housenumber + ' ' + street : street;
      const area = p.district || p.locality || '';
      const parts = [];
      if (p.name && p.name !== street) parts.push(p.name);   // business or building name
      if (streetLine) parts.push(streetLine);
      if (area) parts.push(area);
      if (p.city) parts.push(p.city);
      if (p.postcode) parts.push(p.postcode);
      const seen = new Set();
      return parts.filter(x => x && !seen.has(x) && seen.add(x)).join(', ');
    }

    async function searchAddresses(q, signal) {
      const params = new URLSearchParams({ q, limit: '6', lang: 'en' });
      if (ADDRESS_SEARCH.bbox) params.set('bbox', ADDRESS_SEARCH.bbox);
      const res = await fetch(ADDRESS_SEARCH.url + '?' + params.toString(), { signal });
      if (!res.ok) throw new Error('Address search failed (' + res.status + ')');
      const data = await res.json();
      const seen = new Set();
      return (data.features || [])
        .map(f => ({
          label: formatPhotonAddress(f),
          lat: f.geometry && f.geometry.coordinates ? Number(f.geometry.coordinates[1]) : NaN,
          lng: f.geometry && f.geometry.coordinates ? Number(f.geometry.coordinates[0]) : NaN
        }))
        .filter(i => i.label && Number.isFinite(i.lat) && Number.isFinite(i.lng) && !seen.has(i.label) && seen.add(i.label));
    }

    // Google Maps directions to the job site. Uses the pinned spot when one was picked, else the address text.
    function mapsUrlForJob(j) {
      if (!j) return '';
      const lat = j.siteLat, lng = j.siteLng;
      const pinned = lat !== null && lat !== undefined && lat !== '' && lng !== null && lng !== undefined && lng !== ''
        && Number.isFinite(Number(lat)) && Number.isFinite(Number(lng));
      const dest = pinned ? Number(lat) + ',' + Number(lng) : (j.siteLocation ? encodeURIComponent(j.siteLocation) : '');
      return dest ? 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=' + dest : '';
    }


    // Driving distance from the fixed office address to the selected job-site pin.
    // Requires permission and internet access; never substitute straight-line kilometres.
    const OFFICE_ADDRESS = "27 St James Avenue, Westville, KwaZulu-Natal, South Africa";
    let officeCoordinatesPromise = null;
    async function getOfficeCoordinates() {
      if (!officeCoordinatesPromise) {
        officeCoordinatesPromise = (async () => {
          const candidates = await searchAddresses(OFFICE_ADDRESS);
          const match = candidates.find(x => /st\.? james/i.test(x.label) && /westville/i.test(x.label) && /27/.test(x.label));
          if (!match) throw new Error("Office address could not be verified on the map");
          return match;
        })().catch(err => { officeCoordinatesPromise = null; throw err; });
      }
      return officeCoordinatesPromise;
    }
    function travelDistanceField(value) {
      return `<div class="space-y-2">
        <label class="label" for="job-travel-km">Travel distance (km)</label>
        <div class="flex gap-2 items-center">
          <input id="job-travel-km" type="number" min="0" step="0.1" name="travelKm" class="input flex-1" value="${value != null ? esc(value) : ''}" placeholder="Not calculated" />
          <button type="button" class="btn btn-secondary shrink-0 text-xs" id="calculate-travel-km">Calculate km</button>
        </div>
        <p id="travel-km-status" class="text-xs text-slate-500" aria-live="polite">From 27 St James Avenue, Westville, to the pinned site by road. You can adjust the km manually.</p>
      </div>`;
    }

    function bindTravelDistance() {
      const button = document.getElementById('calculate-travel-km');
      const output = document.getElementById('job-travel-km');
      const status = document.getElementById('travel-km-status');
      const site = document.getElementById('site-input');
      if (!button || !output || !status) return;
      const setStatus = message => { status.textContent = message; };
      if (site) {
        site.addEventListener('input', () => {
          output.value = '';
          setStatus('Site address changed. Choose a map suggestion and recalculate.');
        });
      }
      button.addEventListener('click', async () => {
        const lat = Number(document.getElementById('site-lat')?.value);
        const lng = Number(document.getElementById('site-lng')?.value);
        if (!document.getElementById('site-lat')?.value || !document.getElementById('site-lng')?.value || !Number.isFinite(lat) || !Number.isFinite(lng)) {
          setStatus('Select the site from the map suggestions first, then calculate.');
          return;
        }
        if (!navigator.onLine) { setStatus('Internet is needed to calculate driving distance. Enter kilometres manually or try again online.'); return; }
        button.disabled = true;
        setStatus('Finding the office address on the map…');
        try {
          const office = await getOfficeCoordinates();
          const originLat = office.lat, originLng = office.lng;
          setStatus('Calculating driving route…');
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 15000);
          let response;
          try {
            response = await fetch(`https://router.project-osrm.org/route/v1/driving/${originLng},${originLat};${lng},${lat}?overview=false&alternatives=false`, { signal: controller.signal });
          } finally { clearTimeout(timeout); }
          if (!response.ok) throw new Error('Routing service unavailable');
          const data = await response.json();
          const meters = data.routes?.[0]?.distance;
          if (data.code !== 'Ok' || !Number.isFinite(meters)) throw new Error('No driving route found');
          const km = Math.round(meters / 100) / 10;
          output.value = km.toFixed(1);
          setStatus(`${km.toFixed(1)} km by road from the Westville office to the job site. Estimate only; actual travel may differ.`);
        } catch (err) {
          setStatus(err?.message?.includes('Office address') ? 'Office address could not be confirmed in map suggestions. Enter km manually or retry later.' : 'Could not calculate the driving route. Check internet and the site pin, or enter km manually.');
        } finally { button.disabled = false; }
      });
    }

    function addressFieldHtml(name, label, value, lat, lng, prefix, required = false) {
      const pinned = lat != null && lat !== '' && lng != null && lng !== '';
      return `<div><label class="label" for="${prefix}-input">${label}</label>
        <input name="${name}" id="${prefix}-input" data-address-prefix="${prefix}" class="input" autocomplete="off" placeholder="Start typing an address…" value="${esc(value || '')}" ${required ? 'required' : ''} />
        <input type="hidden" name="${name === 'siteLocation' ? 'siteLat' : name + 'Lat'}" id="${prefix}-lat" value="${pinned ? esc(lat) : ''}" />
        <input type="hidden" name="${name === 'siteLocation' ? 'siteLng' : name + 'Lng'}" id="${prefix}-lng" value="${pinned ? esc(lng) : ''}" />
        <div id="${prefix}-suggest" class="hidden mt-1 card overflow-hidden"></div>
        <div id="${prefix}-status" class="text-xs mt-1 text-slate-500">${pinned ? 'Map location saved. You can edit it.' : 'Choose a map suggestion, or enter the address manually.'}</div></div>`;
    }
    function siteFieldHtml(value, lat, lng) { return addressFieldHtml('siteLocation','Site / location',value,lat,lng,'site',true); }

    function bindSiteAutocomplete() {
      document.querySelectorAll('[data-address-prefix]').forEach(input => {
      if (input.dataset.bound) return;
      input.dataset.bound = '1';
      const prefix = input.dataset.addressPrefix;
      const latEl = document.getElementById(prefix+'-lat');
      const lngEl = document.getElementById(prefix+'-lng');
      const box = document.getElementById(prefix+'-suggest');
      const status = document.getElementById(prefix+'-status');
      let timer = null, controller = null, seq = 0;

      const setStatus = (text, ok) => {
        status.textContent = text;
        status.className = 'text-xs mt-1 ' + (ok ? 'text-emerald-600' : 'text-slate-400');
      };
      const hide = () => { box.classList.add('hidden'); box.innerHTML = ''; };
      const credit = '<div class="px-3 py-1.5 text-[11px] text-slate-400 bg-slate-50">Address data © OpenStreetMap contributors</div>';

      const pick = (item) => {
        input.value = item.label;
        latEl.value = item.lat.toFixed(6);
        lngEl.value = item.lng.toFixed(6);
        hide();
        setStatus('Map spot saved. Navigate will go to this location.', true);
      };

      const lookup = async (q) => {
        const mine = ++seq;
        if (controller) controller.abort();
        controller = new AbortController();
        try {
          const items = await searchAddresses(q, controller.signal);
          if (mine !== seq) return;
          if (!items.length) {
            box.innerHTML = '<div class="px-3 py-3 text-sm text-slate-500">No matching address found. Keep typing, or just use what you entered.</div>' + credit;
          } else {
            box.innerHTML = '<div class="divide-y divide-slate-100">' + items.map((it, i) =>
              `<button type="button" data-i="${i}" class="w-full text-left flex items-start gap-2 px-3 py-3 text-sm active:bg-brand-50"><span class="text-brand-600 mt-0.5 shrink-0">${icon('map-pin', 'w-4 h-4')}</span><span>${esc(it.label)}</span></button>`
            ).join('') + '</div>' + credit;
            box.querySelectorAll('button[data-i]').forEach(b => b.addEventListener('click', () => pick(items[Number(b.dataset.i)])));
          }
          box.classList.remove('hidden');
        } catch (e) {
          if (e && e.name === 'AbortError') return;
          hide();
          setStatus("Address search isn't available right now. You can still type the address.", false);
        }
      };

      input.addEventListener('input', () => {
        // The text changed, so any previously pinned spot no longer matches it.
        latEl.value = '';
        lngEl.value = '';
        setStatus('Pick a suggestion to pin the exact spot for navigation.', false);
        clearTimeout(timer);
        const q = input.value.trim();
        if (q.length < ADDRESS_SEARCH.minChars) { seq++; if (controller) controller.abort(); hide(); return; }
        timer = setTimeout(() => lookup(q), ADDRESS_SEARCH.delayMs);
      });
      });
    }

    // ---------- Offline queue (temporary device storage; MongoDB remains authoritative) ----------
    const OFFLINE_DB = 'jobcard-ops-offline-v1';
    function openOfflineDb() {
      return new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) return reject(new Error('Offline storage is unavailable on this device.'));
        const req = indexedDB.open(OFFLINE_DB, 1);
        req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains('requests')) req.result.createObjectStore('requests', { keyPath: 'id' }); };
        req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error);
      });
    }
    async function offlineQueueAll() {
      const db = await openOfflineDb();
      return new Promise((resolve, reject) => { const tx = db.transaction('requests', 'readonly'); const r = tx.objectStore('requests').getAll(); r.onsuccess = () => resolve(r.result || []); r.onerror = () => reject(r.error); });
    }
    async function offlineQueuePut(item) {
      const db = await openOfflineDb();
      return new Promise((resolve, reject) => { const tx = db.transaction('requests', 'readwrite'); tx.objectStore('requests').put(item); tx.oncomplete = resolve; tx.onerror = () => reject(tx.error); });
    }
    async function offlineQueueDelete(id) {
      const db = await openOfflineDb();
      return new Promise((resolve, reject) => { const tx = db.transaction('requests', 'readwrite'); tx.objectStore('requests').delete(id); tx.oncomplete = resolve; tx.onerror = () => reject(tx.error); });
    }
    async function syncOfflineQueue() {
      if (!navigator.onLine || !state.token) return;
      let items; try { items = (await offlineQueueAll()).sort((a,b) => a.createdAt - b.createdAt); } catch { return; }
      let synced = 0;
      for (const item of items) {
        try {
          const response = await fetch(API + item.path, { method: item.method, headers: { Authorization: 'Bearer ' + state.token, 'Content-Type': 'application/json' }, body: JSON.stringify(item.body) });
          if (!response.ok) break;
          if (item.method === 'POST' && item.path === '/api/jobs') {
            const created = await response.json().catch(() => null);
            if (created && created.id) { try { const key='jc_cache:/api/jobs'; const list=JSON.parse(localStorage.getItem(key)||'[]'); if(Array.isArray(list)){ const next=list.filter(j=>j.id!=='offline-'+item.id); next.unshift(created); localStorage.setItem(key,JSON.stringify(next)); } } catch {} }
          }
          await offlineQueueDelete(item.id); synced++;
        } catch { break; }
      }
      if (synced) { toast(`${synced} offline change${synced === 1 ? '' : 's'} synced`, 'success'); try { const list = JSON.parse(localStorage.getItem('jc_cache:/api/jobs') || 'null'); if (Array.isArray(list)) localStorage.setItem('jc_cache:/api/jobs', JSON.stringify(list.map(j => { const copy = { ...j }; delete copy._offlinePending; return copy; }))); } catch {} if (state.user) loadViewData(); }
      updateOfflineIndicator();
    }
    async function updateOfflineIndicator() {
      const el = document.getElementById('offline-sync-status'); if (!el) return;
      let count = 0; try { count = (await offlineQueueAll()).length; } catch {}
      el.textContent = !navigator.onLine ? 'Offline · changes saved on this device' : count ? `${count} change${count === 1 ? '' : 's'} waiting to sync` : 'All changes synced';
      el.className = 'text-xs font-medium ' + ((!navigator.onLine || count) ? 'text-amber-700' : 'text-emerald-700');
    }
    window.addEventListener('online', syncOfflineQueue);
    window.addEventListener('online', updateOfflineIndicator);
    window.addEventListener('offline', updateOfflineIndicator);

    // ---------- API helper ----------
    async function api(path, opts = {}) {
      const headers = { ...(opts.headers || {}) };
      if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
      const originalBody = opts.body && typeof opts.body === 'object' && !(opts.body instanceof FormData) ? opts.body : null;
      if (originalBody) { headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(originalBody); }
      try {
        const res = await fetch(API + path, { ...opts, headers });
        if (res.status === 401) { logout(false); throw new Error('Session expired'); }
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Request failed');
        if ((!opts.method || opts.method === 'GET') && (path === '/api/jobs' || /^\/api\/jobs\/[^/]+$/.test(path))) {
          try { localStorage.setItem('jc_cache:' + path, JSON.stringify(data)); } catch {}
        }
        return data;
      } catch (error) {
        const method = (opts.method || 'GET').toUpperCase();
        // Only queue idempotent job updates; offline record creation is deliberately not queued.
        if ((error instanceof TypeError || !navigator.onLine) && ((method === 'PUT' && /^\/api\/jobs\/[^/]+$/.test(path)) || (method === 'POST' && path === '/api/jobs')) && originalBody) {
          const item = { id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()), path, method, body: originalBody, createdAt: Date.now() };
          await offlineQueuePut(item);
          if (method === 'POST') { try { const cached=JSON.parse(localStorage.getItem('jc_cache:/api/jobs')||'[]'); if(Array.isArray(cached)){ cached.unshift({...originalBody,id:'offline-'+item.id,jobNumber:'DRAFT',status:originalBody.status||'open',createdAt:new Date().toISOString(),_offlinePending:true}); localStorage.setItem('jc_cache:/api/jobs',JSON.stringify(cached)); } } catch {} }
          // Optimistically update the cached job so the technician sees the draft they just saved.
          try {
            const jobKey = path;
            const cachedJob = JSON.parse(localStorage.getItem('jc_cache:' + jobKey) || 'null');
            if (cachedJob) localStorage.setItem('jc_cache:' + jobKey, JSON.stringify({ ...cachedJob, ...originalBody, _offlinePending: true }));
            const listKey = '/api/jobs'; const cachedList = JSON.parse(localStorage.getItem('jc_cache:' + listKey) || 'null');
            if (Array.isArray(cachedList)) localStorage.setItem('jc_cache:' + listKey, JSON.stringify(cachedList.map(job => job.id === path.split('/').pop() ? { ...job, ...originalBody, _offlinePending: true } : job)));
          } catch {}
          updateOfflineIndicator();
          toast(method === 'POST' ? 'Job draft saved on this device. It will sync when connection returns.' : 'Saved on this device. It will sync when connection returns.', 'success');
          return { queued: true, offline: true };
        }
        if (method === 'GET' && (path === '/api/jobs' || /^\/api\/jobs\/[^/]+$/.test(path))) {
          try { const cached = localStorage.getItem('jc_cache:' + path); if (cached) return JSON.parse(cached); } catch {}
        }
        throw error;
      }
    }

      if (j.priority === 'low') return '<span class="priority-low text-xs">Low priority</span>';

    function openJobsForUser() {
      const open = (state.data.jobs || []).filter(j => j.status !== 'closed');

      const mine = open.filter(j => String(j.technician || '').toLowerCase() === me);
      const list = (mine.length ? mine : open).slice();
      const rank = { high: 0, normal: 1, low: 2 };

        String(a.workStartDate || '9999').localeCompare(String(b.workStartDate || '9999')) ||

    function splitTime(t) {
      if (!t || typeof t !== 'string') return { h: '', m: '' };
      const p = t.split(':');
      return { h: p[0] || '', m: (p[1] || '').slice(0, 2) };
    }
    function timeSelectHtml(prefix, value) {
      const { h, m } = splitTime(value);
      const hours = Array.from({ length: 24 }, (_, i) => String(i).padStart(2, '0'));
      // Full 1-minute accuracy 00–59
      const mins = Array.from({ length: 60 }, (_, i) => String(i).padStart(2, '0'));
      const hOpts = '<option value="">HH</option>' + hours.map(x =>
        `<option value="${x}" ${h === x ? 'selected' : ''}>${x}</option>`).join('');
      const mm = (m || '').padStart(2, '0');
      const mOpts = '<option value="">MM</option>' + mins.map(x =>
        `<option value="${x}" ${mm === x ? 'selected' : ''}>${x}</option>`).join('');
      return `
        <div class="flex gap-1 items-center">
          <select name="${prefix}H" class="input flex-1" onchange="syncScopeTimesFromSelects()">${hOpts}</select>
          <span class="font-bold text-slate-400">:</span>
          <select name="${prefix}M" class="input flex-1" onchange="syncScopeTimesFromSelects()">${mOpts}</select>
        </div>`;
    }

    function hoursSpentFromTimes(timeIn, timeOut) {
      if (!timeIn || !timeOut) return null;
      const parse = (s) => {
        const p = String(s).split(':');
        if (p.length < 2) return null;
        const h = Number(p[0]), m = Number(p[1]);
        if (Number.isNaN(h) || Number.isNaN(m)) return null;
        return h * 60 + m;
      };
      let a = parse(timeIn), b = parse(timeOut);
      if (a == null || b == null) return null;
      // overnight: e.g. 22:00 -> 01:30
      if (b < a) b += 24 * 60;
      const mins = b - a;
      const hours = Math.floor(mins / 60);
      const minutes = mins % 60;
      const decimal = Math.round((mins / 60) * 100) / 100;
      return { mins, hours, minutes, decimal, label: hours + 'h ' + String(minutes).padStart(2, '0') + 'm (' + decimal + ' hrs)' };
    }

      const monthList = list.filter(f => {
        const d = new Date(f.dateTime);
        return d.getFullYear() === selY && (d.getMonth() + 1) === selM;
      });
      const monthAmt = monthList.reduce((s, f) => s + (Number(f.amount) || 0), 0);
      const monthL = monthList.reduce((s, f) => s + (Number(f.litres) || 0), 0);
      const avgPrice = totalL > 0 ? totalAmt / totalL : null;
      const monthAvg = monthL > 0 ? monthAmt / monthL : null;

      const odos = monthList.map(f => Number(f.odometer)).filter(n => !Number.isNaN(n) && n > 0).sort((a, b) => a - b);
      const odoSpan = odos.length >= 2 ? (odos[odos.length - 1] - odos[0]) : null;
      const last = monthList[0] || list[0];

      const payMap = {};
      monthList.forEach(f => {
        const k = f.paymentMethod || 'Unspecified';
        payMap[k] = (payMap[k] || 0) + (Number(f.amount) || 0);
      });
      const paySummary = Object.keys(payMap).length
        ? Object.entries(payMap).map(([k, v]) => k + ': R ' + v.toFixed(0)).join(' · ')
        : '—';

      // Months that have data, plus current
      const monthSet = new Set();
      monthSet.add(now.toISOString().slice(0, 7));
      list.forEach(f => {
        const d = new Date(f.dateTime);
        if (!isNaN(d)) monthSet.add(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'));
      });
      const monthOptions = [...monthSet].sort().reverse().map(key => {
        const [yy, mm] = key.split('-').map(Number);
        const label = new Date(yy, mm - 1, 1).toLocaleString(undefined, { month: 'long', year: 'numeric' });
        return `<option value="${key}" ${key === state.fuelMonth ? 'selected' : ''}>${label}</option>`;
      }).join('');

      const tile = (label, value, sub) => `
        <div class="card p-4 min-w-0">
          <div class="text-[11px] uppercase tracking-wide text-slate-500">${label}</div>
          <div class="text-lg font-bold text-brand-900 truncate">${value}</div>
          ${sub ? `<div class="text-[11px] text-slate-400 mt-0.5 truncate">${sub}</div>` : ''}
        </div>`;

      return `
        <div class="space-y-2">
          <div class="card p-4 flex flex-wrap items-center gap-2">
            <label class="text-sm font-medium text-slate-600">Month</label>
            <select class="input flex-1 min-w-[160px]" onchange="setFuelMonth(this.value)">
              ${monthOptions}
            </select>
            <button type="button" onclick="exportFuelMonthPdf(state.fuelMonth)" class="btn btn-secondary text-xs whitespace-nowrap">Download ${monthName} report</button>
          </div>

          <div class="grid grid-cols-2 gap-2">
            ${tile(isCurrent ? 'This month' : monthName, 'R ' + monthAmt.toFixed(2), monthList.length + ' fill-up' + (monthList.length === 1 ? '' : 's'))}
            ${tile('Month litres', (monthL ? monthL.toFixed(1) : '0') + ' L', monthAvg != null ? 'Avg R ' + monthAvg.toFixed(2) + '/L' : '—')}
            ${tile('All time', 'R ' + totalAmt.toFixed(2), list.length + ' total entries')}
            ${tile('All litres', (totalL ? totalL.toFixed(1) : '0') + ' L', avgPrice != null ? 'Avg R ' + avgPrice.toFixed(2) + '/L' : '—')}
          </div>

          <div class="card p-4 space-y-1.5 text-sm">
            <div class="flex justify-between gap-2">
              <span class="text-slate-500">Last fill-up${isCurrent ? '' : ' in month'}</span>
              <span class="font-medium text-right">${last && monthList.length ? (new Date(last.dateTime).toLocaleDateString() + ' · R ' + (Number(last.amount) || 0).toFixed(2) + (last.litres != null ? ' · ' + last.litres + ' L' : '')) : '—'}</span>
            </div>
            <div class="flex justify-between gap-2">
              <span class="text-slate-500">Last vehicle</span>
              <span class="font-medium text-right">${last && monthList.length ? esc(last.vehicle || '—') + (last.station ? ' @ ' + esc(last.station) : '') : '—'}</span>
            </div>
            <div class="flex justify-between gap-2">
              <span class="text-slate-500">Odometer range</span>
              <span class="font-medium text-right">${odoSpan != null ? odos[0] + ' → ' + odos[odos.length - 1] + ' km (' + odoSpan + ' km)' : (odos.length === 1 ? odos[0] + ' km' : '—')}</span>
            </div>
            <div class="flex justify-between gap-2">
              <span class="text-slate-500">Paid this month</span>
              <span class="font-medium text-right text-xs sm:text-sm">${esc(paySummary)}</span>
            </div>
          </div>

          <div class="flex gap-2">
            <button type="button" onclick="state.modal={type:'newFuel'};render()" class="btn btn-primary flex-1">+ Log Fuel</button>
            <button type="button" onclick="exportFuelMonthPdf(state.fuelMonth)" class="btn btn-secondary flex-1 text-xs">Download report</button>
          </div>

          <div class="text-xs font-semibold text-slate-500 uppercase tracking-wide px-0.5">Entries for ${monthName}</div>
          <div class="space-y-2">
            ${monthList.length === 0 ? '<p class="text-sm text-slate-400 text-center py-8">No fuel logs for this month</p>' :
              monthList.map(f => `
                <div class="card p-4 cursor-pointer active:bg-slate-50" onclick="state.modal={type:'viewFuel',id:'${f.id}'};render()">
                  <div class="flex justify-between gap-2">
                    <div class="min-w-0">
                      <div class="font-medium text-sm">${esc(f.ref || '')} · ${esc(f.vehicle)} ${f.registration ? '('+esc(f.registration)+')' : ''}</div>
                      <div class="text-xs text-slate-500">${f.litres || '—'} L · ${esc(f.fuelType)} · R ${f.amount || 0}${f.paymentMethod ? ' · ' + esc(f.paymentMethod) : ''}</div>
                      <div class="text-xs text-slate-400">${esc(f.station || '')} · ${esc(f.driver || '')} · ${new Date(f.dateTime).toLocaleString()}</div>
                      ${f.odometer ? `<div class="text-xs text-slate-400">Odo: ${f.odometer} km</div>` : ''}
                      <div class="text-xs text-brand-600 mt-1">View · Edit · PDF ›</div>
                    </div>
                    ${f.receiptData || f.receipt ? `<img src="${f.receiptData || f.receipt}" class="w-12 h-12 object-cover rounded border shrink-0" />` : ''}
                  </div>
                </div>
              `).join('')}
          </div>
        </div>
      `;
    }

    // ---------- USERS ----------
    function renderUsers() {
      if (state.user.role !== 'admin') return '<p class="text-center text-slate-500 py-8">Admin access required</p>';
      const list = state.data.users || [];
      const vehicles = state.data.vehicles || [];
      return `
        <div class="space-y-5">
          <div class="space-y-2">
            <div class="flex items-center justify-between">
              <h3 class="font-display text-lg text-slate-800">Users</h3>
              <div class="flex gap-1">
                ${state.user.username === 'Admin' ? `<button type="button" onclick="forceLogoutAdmin()" class="btn btn-danger text-xs py-1">Force logout Admin</button>` : ''}
                <button type="button" onclick="state.modal={type:'newUser'};render()" class="btn btn-primary text-xs py-1">+ Add User</button>
              </div>
            </div>
            ${list.length === 0 ? '<p class="text-sm text-slate-400 text-center py-4">No users</p>' :
              list.map(u => `
                <div class="card p-4 flex justify-between items-center">
                  <div>
                    <div class="font-medium">${esc(u.name)}</div>

                  </div>

                    <button type="button" onclick="editUser('${u.id}')" class="btn btn-secondary text-xs">Edit</button>
                    ${u.username !== 'Admin' ? `<button type="button" onclick="deleteUser('${u.id}')" class="btn btn-danger text-xs">Remove</button>` : ''}

          <div class="space-y-2">
            <div class="flex items-center justify-between">
              <h3 class="font-display text-lg text-slate-800">Company Vehicles</h3>
              <button type="button" onclick="state.modal={type:'newVehicle'};render()" class="btn btn-primary text-xs py-1">+ Add Vehicle</button>
            </div>
            ${vehicles.length === 0 ? '<p class="text-sm text-slate-400 text-center py-4">No vehicles yet. Add one to use it in fuel logs.</p>' :
              vehicles.map(v => `
                <div class="card p-4 flex justify-between items-center">
                  <div>
                    <div class="font-medium">${esc(v.name)}</div>

                    <button type="button" onclick="deleteVehicle('${v.id}')" class="btn btn-danger text-xs">Delete</button>
                  </div>
                </div>
              `).join('')}
          </div>
        </div>
      `;
    }

    function renderAudit() {
      if (state.user.role !== 'admin') return '<p class="text-center text-slate-500 py-8">Admin access required</p>';
      const list = state.data.audit || [];
      return `
        <div class="space-y-2">
          ${list.length === 0 ? '<p class="text-sm text-slate-400 text-center py-8">No audit entries</p>' :
            list.map(a => `
              <div class="card p-2 text-xs">
                <span class="font-medium">${a.action}</span> ${a.entity} ${a.entityId ? a.entityId.slice(0,8) : ''}

              </div>
            `).join('')}

      `;
    }

    // ---------- MODALS ----------
    function renderModal() {

      if (!m) return '';
      if (m.type === 'more') {
        return `

            <div class="modal-panel bg-white rounded-t-2xl sm:rounded-2xl w-full max-w-sm p-4 space-y-1 shadow-xl" onclick="event.stopPropagation()">
              <div class="text-center font-display text-lg mb-2">More</div>
              <button type="button" onclick="navTo('deliveries')" class="w-full flex items-center gap-3 text-left p-3 rounded-lg hover:bg-slate-50 active:bg-slate-50 font-medium"><span class="text-brand-600">${icon('package')}</span>Deliveries & Collections</button>
              <button type="button" onclick="navTo('customers')" class="w-full flex items-center gap-3 text-left p-3 rounded-lg hover:bg-slate-50 active:bg-slate-50 font-medium"><span class="text-brand-600">${icon('users')}</span>Clients</button>
              ${['admin','office'].includes(state.user.role) ? `<button type="button" onclick="navTo('reports')" class="w-full flex items-center gap-3 text-left p-3 rounded-lg hover:bg-slate-50 active:bg-slate-50 font-medium"><span class="text-brand-600">${icon('chart-column')}</span>Reports & CSV Export</button>` : ''}
              ${state.user.role === 'admin' ? `
                <button type="button" onclick="downloadOwnerBackup()" class="w-full flex items-center gap-3 text-left p-3 rounded-lg hover:bg-slate-50 active:bg-slate-50 font-medium"><span class="text-brand-600">${icon('file-text')}</span>Backup & Export Data</button>
                <button type="button" onclick="navTo('users')" class="w-full flex items-center gap-3 text-left p-3 rounded-lg hover:bg-slate-50 active:bg-slate-50 font-medium"><span class="text-brand-600">${icon('user')}</span>Users & Roles</button>
                <button type="button" onclick="navTo('audit')" class="w-full flex items-center gap-3 text-left p-3 rounded-lg hover:bg-slate-50 active:bg-slate-50 font-medium"><span class="text-brand-600">${icon('file-text')}</span>Audit Trail</button>
              ` : ''}
              <div class="mx-2 my-2 rounded-lg bg-slate-50 px-3 py-2 flex items-center justify-between gap-2"><span class="text-xs text-slate-500">Sync status</span><span id="offline-sync-status" class="text-xs font-medium">Checking…</span></div>
              <button type="button" onclick="closeModal()" class="w-full text-center p-3 text-slate-500">Close</button>
            </div>
          </div>`;
      }


      if (m.type === 'signDelivery') {

        const who = d.type === 'collection' ? 'who handed over the collection' : 'who received the delivery';
        return `
          <div class="fixed inset-0 z-50 bg-white flex flex-col" style="position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;background:#fff;display:flex;flex-direction:column;box-sizing:border-box;touch-action:none;overscroll-behavior:none;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)">
            <div class="flex items-center justify-between px-4 py-3 border-b">
              <div>
                <div class="font-semibold">${d.type === 'collection' ? 'Collection sign-off' : 'Delivery sign-off'}</div>
                <div class="text-xs text-slate-500">${esc(d.ref || '')} · ${who}</div>
              </div>
              <button type="button" onclick="closeModal()" class="text-slate-400 text-3xl leading-none px-2">&times;</button>
            </div>
            <div class="px-4 pt-3">
              <label class="label">Name of person signing</label>
              <input id="dc-sign-name" class="input" value="${esc(d.signature?.signedBy || '')}" placeholder="Full name" />
            </div>
            <div class="flex-1 p-3 min-h-0">
              <canvas id="sig-canvas" class="w-full h-full border-2 border-dashed border-brand-200 rounded-lg bg-white touch-none" style="touch-action:none"></canvas>
            </div>
            <div class="p-3 flex gap-2 border-t">
              <button type="button" onclick="clearSigPad()" class="btn btn-secondary flex-1">Clear</button>
              <button type="button" onclick="saveDeliverySignature('${d.id}')" class="btn btn-primary flex-1">Save signature</button>
            </div>
          </div>`;
      }

      if (m.type === 'signJob') {
        return `
          <div class="fixed inset-0 z-50 bg-white flex flex-col" style="position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;background:#fff;display:flex;flex-direction:column;box-sizing:border-box;touch-action:none;overscroll-behavior:none;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)">
            <div class="flex items-center justify-between px-4 py-3 border-b">
              <div>
                <div class="font-semibold">Customer Signature</div>
                <div class="text-xs text-slate-500">${esc(state.selectedJob?.jobNumber || '')} · Please sign in the box below</div>
              </div>
              <button onclick="closeSignModal()" class="text-slate-400 text-3xl leading-none px-2" aria-label="Cancel">&times;</button>
            </div>
            <div class="px-4 pt-3">
              <label class="label">Name of person signing (optional)</label>
              <input id="sig-name" class="input" placeholder="Customer" autocomplete="off" />
            </div>
            <div class="flex-1 min-h-0 relative m-4" style="position:relative;flex:1 1 0%;min-height:0;margin:16px">
              <canvas id="sig-canvas" class="sig-canvas absolute inset-0 w-full h-full" style="position:absolute;top:0;left:0;width:100%;height:100%;box-sizing:border-box"></canvas>
            </div>
            <div class="flex gap-2 px-4 pb-4">
              <button onclick="clearSig()" class="btn btn-secondary flex-1 py-3">Clear</button>
              <button onclick="closeSignModal()" class="btn btn-secondary flex-1 py-3">Cancel</button>
              <button id="sig-save" onclick="saveSig()" class="btn btn-primary flex-[2] py-3">Save Signature</button>
            </div>
          </div>`;
      }

      let title = '', body = '';
      if (m.type === 'newCustomer' || m.type === 'editCustomer') {
        const c = m.data || {};
        const editing = m.type === 'editCustomer';
        title = editing ? 'Edit customer' : 'Add customer';
        body = `
          <form id="modal-form" class="space-y-3">

            <div>
              <label class="label">Customer</label>
              <select name="customerId" id="new-job-customer" class="input">
                <option value="">— Select or type below —</option>

            <div><label class="label">Contact person</label><input name="customerContactPerson" id="new-job-contact" class="input" /></div>
            <div class="grid grid-cols-2 gap-2"><div><label class="label">Phone</label><input name="customerPhone" id="new-job-phone" type="tel" class="input" /></div><div><label class="label">Email</label><input name="customerEmail" id="new-job-email" type="email" class="input" /></div></div>
            ${siteFieldHtml('', null, null)}
            <div><label class="label">Description</label><textarea name="description" id="new-job-description" class="input" rows="3" required></textarea></div><input type="hidden" name="workCarriedOut" id="new-job-scope" /><input type="hidden" name="scopeComments" id="new-job-checklist" />
            <div class="grid grid-cols-2 gap-2">
              <div><label class="label">Priority</label>

                <select name="vehicle" class="input">

              <div>

                <select name="technician" class="input">
                  <option value="">— Select —</option>
                  ${(state.data.staff || []).map(s =>
                    `<option value="${esc(s.name)}" ${s.name === state.user.name ? 'selected' : ''}>${esc(s.name)}</option>`

                </select>

            ${!(state.data.vehicles || []).length ? '<p class="text-[11px] text-amber-600">No vehicles yet. Add them under Users & Roles.</p>' : ''}
            <div class="grid grid-cols-2 gap-2">
              <div><label class="label">Work end date</label><input type="date" name="workEndDate" class="input" /></div>
              <div>${travelDistanceField(null)}</div>

            <button type="submit" class="btn btn-primary w-full">Create Job Card</button>
          </form>`;
      } else if (m.type === 'newDelivery' || m.type === 'editDelivery') {
        const isEdit = m.type === 'editDelivery';
        const d = isEdit ? (findDelivery(m.id) || {}) : {};
        const dtype = d.type || m.dtype || 'delivery';
        const label = dtype === 'collection' ? 'Collection' : 'Delivery';
        title = isEdit ? 'Edit ' + label + (d.ref ? ' ' + esc(d.ref) : '') : 'New ' + label;
        body = `
          <form id="modal-form" class="space-y-2">
            ${isEdit ? `
              <div><label class="label">Type</label>
                <select name="type" class="input">
                  <option value="delivery" ${dtype === 'delivery' ? 'selected' : ''}>Delivery</option>
                  <option value="collection" ${dtype === 'collection' ? 'selected' : ''}>Collection</option>
                </select>
              </div>` : `<input type="hidden" name="type" value="${esc(dtype)}" />`}
            <div><label class="label">Item / Package details</label><input name="itemDetails" class="input" value="${esc(d.itemDetails)}" required /></div>
            <div><label class="label">Customer / Site</label><input name="customerName" class="input" value="${esc(d.customerName)}" /></div>
            ${addressFieldHtml('site','Site address',d.site,d.siteLat,d.siteLng,'delivery-site')}
            <div><label class="label">Driver</label><input name="driver" class="input" value="${esc(isEdit ? d.driver : state.user.name)}" /></div>
            <div><label class="label">Date & time</label><input type="datetime-local" name="dateTime" class="input" value="${toLocalInput(d.dateTime)}" /></div>
            <div><label class="label">Status</label>
              <select name="status" class="input">
                <option value="completed" ${(d.status || 'completed') === 'completed' ? 'selected' : ''}>Completed</option>
                <option value="pending" ${d.status === 'pending' ? 'selected' : ''}>Pending</option>
              </select>
            </div>
            <div><label class="label">Notes</label><input name="notes" class="input" value="${esc(d.notes)}" /></div>
            <div>
              <label class="label">Photos</label>
              <div class="flex gap-1 flex-wrap">
                <button type="button" class="btn btn-secondary text-xs py-1.5 px-2" onclick="document.getElementById('dc-new-camera').click()">Camera</button>
                <button type="button" class="btn btn-secondary text-xs py-1.5 px-2" onclick="document.getElementById('dc-new-gallery').click()">Gallery</button>

              <input id="dc-new-gallery" type="file" accept="image/*" class="hidden" onchange="addPendingDcPhoto(event)" />
              <div id="dc-new-previews" class="grid grid-cols-3 gap-2 mt-2">
                ${(state.pendingDcPhotos || []).map((src, i) => `
                  <div class="relative">
                    <img src="${src}" class="w-full h-20 object-cover rounded border" />

    // ---------- Signature ----------
    let sigPad = null;
    let sigObserver = null;
    let sigSaving = false;
    function initSigPad(canvas) {
      const ctx = canvas.getContext('2d');
      let drawing = false;
      let hasInk = false;

      // Size the drawing bitmap to the box's real on-screen size (device pixels)
      const setup = () => {
        const r = canvas.getBoundingClientRect();
        if (r.width < 2 || r.height < 2) return false; // not laid out yet
        const ratio = Math.max(window.devicePixelRatio || 1, 1);
        const w = Math.round(r.width * ratio), h = Math.round(r.height * ratio);
        if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.strokeStyle = '#1e3a8a';
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        return true;
      };
      setup();

      // Finger position -> bitmap coordinates (stays correct even if CSS size and bitmap size differ)
      const pos = (e) => {
        const r = canvas.getBoundingClientRect();
        const t = e.touches && e.touches[0] ? e.touches[0] : e;
        return {
          x: (t.clientX - r.left) * (canvas.width / r.width),
          y: (t.clientY - r.top) * (canvas.height / r.height),
          k: canvas.width / r.width
        };
      };
      const start = (e) => {
        e.preventDefault();
        if (canvas.width < 2) setup();
        drawing = true;
        hasInk = true;
        const p = pos(e);
        ctx.lineWidth = 2.5 * p.k;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x + 0.01, p.y + 0.01); // lets a single tap leave a dot
        ctx.stroke();
      };
      const move = (e) => { if (!drawing) return; e.preventDefault(); const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };
      const end = () => { drawing = false; };
      canvas.addEventListener('mousedown', start);
      canvas.addEventListener('mousemove', move);
      canvas.addEventListener('mouseup', end);
      canvas.addEventListener('mouseleave', end);
      canvas.addEventListener('touchstart', start, { passive: false });
      canvas.addEventListener('touchmove', move, { passive: false });
      canvas.addEventListener('touchend', end);
      canvas.addEventListener('touchcancel', end);

      // Re-size when the layout settles / phone rotates / keyboard opens (only while still blank)
      if (sigObserver) sigObserver.disconnect();
      if ('ResizeObserver' in window) {
        sigObserver = new ResizeObserver(() => { if (!hasInk) setup(); });
        sigObserver.observe(canvas);
      }

      sigPad = {
        canvas,
        ctx,
        get hasInk() { return hasInk; },
        clear: () => { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.restore(); hasInk = false; setup(); }
      };
    }

    // Crop to the pen strokes (with padding) on a white background; returns null if nothing was drawn
    function exportSigData(canvas) {
      const { width, height } = canvas;
      const px = canvas.getContext('2d').getImageData(0, 0, width, height).data;
      let minX = width, minY = height, maxX = -1, maxY = -1;
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          if (px[(y * width + x) * 4 + 3] > 0) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (maxX < 0) return null;
      const pad = 24;
      const sx = Math.max(0, minX - pad), sy = Math.max(0, minY - pad);
      const sw = Math.min(width, maxX + pad) - sx, sh = Math.min(height, maxY + pad) - sy;
      const c = document.createElement('canvas');
      c.width = sw;
      c.height = sh;
      const cx = c.getContext('2d');
      cx.fillStyle = '#ffffff';
      cx.fillRect(0, 0, sw, sh);
      cx.drawImage(canvas, sx, sy, sw, sh, 0, 0, sw, sh);
      return c.toDataURL('image/png');
    }

    function resizeImageForUpload(file) {
      return new Promise(function(resolve, reject) {
        var url = URL.createObjectURL(file);
        var img = new Image();
        var done = false;
        var timer = setTimeout(function() {
          if (done) return;
          done = true;
          URL.revokeObjectURL(url);
          // last resort: raw base64 (may fail if huge)
          fileToBase64(file).then(resolve).catch(reject);
        }, 15000);
        img.onload = function() {
          if (done) return;
          try {
            var maxSide = 1200;
            var w = img.naturalWidth || img.width || 1;
            var h = img.naturalHeight || img.height || 1;
            if (w > maxSide || h > maxSide) {
              var scale = maxSide / Math.max(w, h);
              w = Math.max(1, Math.round(w * scale));
              h = Math.max(1, Math.round(h * scale));
            }
            var c = document.createElement('canvas');
            c.width = w;
            c.height = h;
            var ctx = c.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            var data = c.toDataURL('image/jpeg', 0.7);
            done = true;
            clearTimeout(timer);
            URL.revokeObjectURL(url);
            if (!data || data.length < 50) reject(new Error('Could not process image'));
            else resolve(data);
          } catch (err) {
            done = true;
            clearTimeout(timer);
            URL.revokeObjectURL(url);
            reject(err);
          }
        };
        img.onerror = function() {
          if (done) return;
          done = true;
          clearTimeout(timer);
          URL.revokeObjectURL(url);
          fileToBase64(file).then(resolve).catch(function() {
            reject(new Error('This image format is not supported. Try a different photo.'));
          });
        };
        img.src = url;
      });
    }

    function pdfEnsureSpace(doc, y, need, margin) {
      if (y + need > 278) {
        doc.addPage();
        // thin top accent on continuation pages
        doc.setFillColor(37, 99, 235);
        doc.rect(0, 0, 210, 1.2, 'F');
        return 16;
      }
      return y;
    }

    function pdfSectionTitle(doc, title, y, margin) {
      y = pdfEnsureSpace(doc, y, 12, margin);
      doc.setFillColor(37, 99, 235);
      doc.roundedRect(margin, y - 4, 2.2, 6, 0.5, 0.5, 'F');
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(11);
      doc.setTextColor(30, 41, 59);
      doc.text(title, margin + 5, y);
      return y + 7;
    }

    function pdfKV(doc, label, value, y, margin, colWidth) {
      const labelW = 38;
      const val = String(value == null || value === '' ? '—' : value);
      const lines = doc.splitTextToSize(val, colWidth - labelW - 2);
      const h = Math.max(5, lines.length * 4.2);
      y = pdfEnsureSpace(doc, y, h + 1, margin);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(8);
      doc.setTextColor(100, 116, 139);
      doc.text(label, margin, y);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9.5);
      doc.setTextColor(15, 23, 42);
      doc.text(lines, margin + labelW, y);
      return y + h;
    }

    function pdfBodyText(doc, text, y, margin, size) {
      size = size || 9.5;
      const lines = doc.splitTextToSize(String(text || '—'), 178);
      const h = lines.length * (size * 0.42) + 1;
      y = pdfEnsureSpace(doc, y, h, margin);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(size);
      doc.setTextColor(30, 41, 59);
      doc.text(lines, margin, y);
      return y + h;
    }

    function pdfFooter(doc) {
      const pages = doc.internal.getNumberOfPages();
      for (let i = 1; i <= pages; i++) {
        doc.setPage(i);

            const maxW = 55, maxH = 16;

            const sigX = margin + 32;

    function loadImageAsDataUrl(url) {
      return new Promise((resolve, reject) => {
        // Prefer fetch so same-origin uploads work reliably
        fetch(url, { credentials: 'same-origin' })
          .then(r => {
            if (!r.ok) throw new Error('Image fetch failed');
            return r.blob();
          })
          .then(blob => {
            const reader = new FileReader();
            reader.onload = () => {
              // Re-encode via canvas to a reasonable JPEG size for PDF
              const img = new Image();
              img.onload = () => {
                try {
                  const maxSide = 1200;
                  let w = img.width;
                  let h = img.height;
                  if (w > maxSide || h > maxSide) {
                    const scale = maxSide / Math.max(w, h);
                    w = Math.round(w * scale);
                    h = Math.round(h * scale);
                  }
                  const c = document.createElement('canvas');
                  c.width = w;
                  c.height = h;
                  const ctx = c.getContext('2d');
                  ctx.fillStyle = '#ffffff';
                  ctx.fillRect(0, 0, w, h);
                  ctx.drawImage(img, 0, 0, w, h);
                  resolve(c.toDataURL('image/jpeg', 0.85));
                } catch (err) {
                  reject(err);
                }
              };
              img.onerror = reject;
              img.src = reader.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(blob);
          })
          .catch(() => {
            // Fallback: direct Image load
            const img = new Image();
            img.onload = () => {
              try {
                const c = document.createElement('canvas');
                c.width = img.width;
                c.height = img.height;
                c.getContext('2d').drawImage(img, 0, 0);
                resolve(c.toDataURL('image/jpeg', 0.85));
              } catch (err) {
                reject(err);
              }
            };
            img.onerror = reject;
            img.src = url;
          });
      });
    }

    function fileToBase64(file) {
      return new Promise((res, rej) => {
        const reader = new FileReader();
        reader.onload = () => res(reader.result);
        reader.onerror = rej;
        reader.readAsDataURL(file);
      });
    }

      } catch(e){if(e.name!=='AbortError')toast(e.message||'Could not share PDF','error');}
    };
    window.messageAssignedTech = () => {const j=state.selectedJob;if(!j)return;const msg=`New job ${j.jobNumber}\nCustomer: ${j.customerName||''}\nAddress: ${j.siteLocation||''}\nWork: ${j.description||''}`;window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank','noopener');};
    window.loadCustomerHistory = async () => {
      const j = state.selectedJob; if (!j) return;
      const target = document.getElementById('customer-history-content');
      const activity = document.getElementById('job-history-content');
      try {
        const jobs = await api('/api/jobs');
        const prior = jobs.filter(x => x.id !== j.id && ((j.customerId && x.customerId === j.customerId) || (!j.customerId && x.customerName === j.customerName))).slice(0,6);
        if (target) target.innerHTML = prior.length ? prior.map(x => `<button class="w-full text-left border-b border-slate-100 py-2" onclick="openJob('${esc(x.id)}')"><span class="font-semibold text-brand-700">${esc(x.jobNumber)}</span> · ${esc(x.description || 'Job')}<span class="block text-xs text-slate-400">${esc(x.workCarriedOut || x.status || '')} · ${esc((x.partsUsed||[]).map(p=>p.item+' × '+(p.quantity||1)+(p.serialNumber?' · '+p.serialNumber:'')).join(', ') || x.equipmentSpares || 'No equipment recorded')} · ${x.createdAt ? new Date(x.createdAt).toLocaleDateString() : ''}</span></button>`).join('') : '<p>No previous jobs found for this customer.</p>';
        const hist = activity ? await api('/api/jobs/' + j.id + '/history') : {comments:[],events:[]};
        if (activity) activity.innerHTML = [...(hist.comments || []).map(c => `<div class="rounded-lg bg-slate-50 p-2"><p>${esc(c.message)}</p><p class="text-xs text-slate-400 mt-1">${esc(c.userName || 'Team')} · ${new Date(c.at).toLocaleString()}</p></div>`), ...(hist.events || []).slice(0,8).map(e => `<div class="text-xs border-l-2 border-brand-200 pl-2">${esc(e.userName||'Team member')} · ${esc(e.action)}${e.details?.changedFields?.length ? ' · '+esc(e.details.changedFields.join(', ')) : ''} · ${new Date(e.at).toLocaleString()}</div>`)].join('') || '<p>No activity yet.</p>';
      } catch(e) { if(target) target.textContent='History is unavailable while offline.'; }
    };
    window.postJobComment = async (event) => {
      event.preventDefault(); const input = document.getElementById('job-comment-input'); const message = input?.value.trim(); if(!message) return;
      try { await api('/api/jobs/' + state.selectedJob.id + '/comments', {method:'POST', body:{message}}); input.value=''; loadCustomerHistory(); toast('Comment posted','success'); }
      catch(e) { toast(e.message,'error'); }
    };
    // Quick filters use the full unmodified job collection for counts and filtering.
    const _baseRenderJobs = renderJobs;
    renderJobs = function() {
      const allJobs = state.data.jobs || [];
      const selected = state.jobQuickFilter || 'all';
      const counts = {
        all: allJobs.length,
        invoice: allJobs.filter(j => j.invoiceStatus === 'to_invoice').length,
        closed: allJobs.filter(j => j.status === 'closed').length,
        in_progress: allJobs.filter(j => j.status === 'in_progress').length
      };
      const filtered = allJobs.filter(j => selected === 'all' ||
        (selected === 'invoice' ? j.invoiceStatus === 'to_invoice' : j.status === selected));
      const previousStatusFilter = state.filters.jobStatus;
      state.filters.jobStatus = ''; // quick filters are the single status selector
      state.data.jobs = filtered;
      let html;
      try { html = _baseRenderJobs(); }
      finally { state.data.jobs = allJobs; state.filters.jobStatus = previousStatusFilter; }
      const tabs = [
        ['all', 'All Jobs'],
        ['invoice', 'Needs Invoicing'],
        ['closed', 'Closed'],
        ['in_progress', 'In Progress']
      ];
      const tools = `<div class="card p-3 flex flex-wrap gap-2 items-center" role="group" aria-label="Filter job cards">${tabs.map(([key,label]) =>
        `<button type="button" class="btn ${selected === key ? 'btn-primary' : 'btn-secondary'} text-xs" aria-pressed="${selected === key}" onclick="setJobQuickFilter('${key}')">${label} (${counts[key]})</button>`
      ).join('')}</div>`;
      return html.replace('<div class="space-y-2">', '<div class="space-y-3">' + tools);
    };
    window.setJobQuickFilter = filter => { state.jobQuickFilter = filter; state.filters.jobStatus = ''; render(); };
    window.showInvoiceQueue = () => setJobQuickFilter('invoice');
    window.clearJobQuickFilter = () => setJobQuickFilter('all');
    // Keep an editable draft on-device while filling forms; clear it after successful submission.
    document.addEventListener('input', (e) => { const f = e.target.closest('#modal-form'); if(!f) return; try { localStorage.setItem('jc_form_draft', JSON.stringify({at:Date.now(), type:state.modal?.type, fields:Object.fromEntries(new FormData(f).entries())})); } catch(_){} });
    document.addEventListener('click', (e) => { if(e.target.closest('#modal-form button[type="submit"]')) setTimeout(() => { if(!state.modal) localStorage.removeItem('jc_form_draft'); }, 1200); });

    window.downloadOwnerBackup = async () => {
      if (state.user?.role !== 'admin') return toast('Owner access required', 'error');
      try {
        toast('Preparing MongoDB backup…');
        const response = await fetch('/api/admin/backup', { headers: { Authorization: 'Bearer ' + state.token } });
        if (!response.ok) { const problem = await response.json().catch(() => ({})); throw new Error(problem.error || 'Backup failed'); }
        const blob = await response.blob();
        const disposition = response.headers.get('Content-Disposition') || '';
        const match = disposition.match(/filename="?([^";]+)"?/i);
        const filename = match ? match[1] : 'jobcard-ops-backup.tar.gz';
        const url = URL.createObjectURL(blob); const link = document.createElement('a'); link.href = url; link.download = filename; document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 1500);
        toast('MongoDB backup downloaded', 'success');
      } catch (error) { toast(error.message || 'Backup failed', 'error'); }
    };

    // boot
    init().then(() => {
      if (state.user) { loadViewData(); syncOfflineQueue(); }
    });
  </script>

</body>
</html>
