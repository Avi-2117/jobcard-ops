<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Contact Computers — JobCard Ops</title>
  <meta name="description" content="Job management, tasks, deliveries and fuel logging for Contact Computers" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="JobCard Ops" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script>
    tailwind.config = {

      theme: {
        extend: {
          colors: {
            brand: { 50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a' }
          }
        }
      }
    }
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    .sig-canvas { touch-action: none; border: 2px dashed #93c5fd; border-radius: 8px; background: #fff; }
    .status-open { background: #dbeafe; color: #1e40af; }
    .status-in_progress { background: #fef3c7; color: #92400e; }
    .status-closed { background: #d1fae5; color: #065f46; }
    .status-pending { background: #e0e7ff; color: #3730a3; }
    .status-completed { background: #d1fae5; color: #065f46; }
    .priority-high { color: #dc2626; font-weight: 600; }
    .priority-normal { color: #2563eb; }
    .priority-low { color: #6b7280; }
    .card { background: white; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); border: 1px solid #e5e7eb; }
    .nav-active { background: #2563eb; color: white; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0.5rem 1rem; border-radius: 8px; font-weight: 500; font-size: 0.875rem; transition: all .15s; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #f3f4f6; color: #374151; }
    .btn-secondary:hover { background: #e5e7eb; }
    .btn-danger { background: #fee2e2; color: #b91c1c; }
    .btn-success { background: #d1fae5; color: #065f46; }
    .input { width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #d1d5db; border-radius: 8px; font-size: 0.875rem; }
    .input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
    .label { display: block; font-size: 0.75rem; font-weight: 500; color: #4b5563; margin-bottom: 0.25rem; }
    .modal-bg {
      background: rgba(0,0,0,.45);
      overscroll-behavior: none;
      touch-action: none;
      -webkit-overflow-scrolling: none;
    }
    .modal-panel {
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
    }
    body.modal-open {
      overflow: hidden !important;
      position: fixed !important;
      width: 100% !important;
      left: 0;
      right: 0;
      touch-action: none;
    }
    html.modal-open {
      overflow: hidden !important;
    }
    #calendar-grid .day-cell { min-height: 80px; }
    .task-chip { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; margin: 1px 0; cursor: grab; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .spinner { border: 2px solid #e5e7eb; border-top-color: #2563eb; border-radius: 50%; width: 24px; height: 24px; animation: spin .6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); z-index: 100; padding: 10px 20px; border-radius: 8px; color: white; font-size: 0.875rem; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div id="app"></div>
  <div id="toast" class="toast hidden"></div>

  <script>
    const API = '';
    let state = {
      user: null,
      token: localStorage.getItem('jc_token') || null,
      view: 'dashboard',
      data: {},
      loading: false,
      modal: null,
      calendarMonth: new Date(),
      fuelMonth: new Date().toISOString().slice(0, 7),
      filters: {},
      selectedJob: null
    };

    // ---------- API helper ----------
    async function api(path, opts = {}) {
      const headers = { ...(opts.headers || {}) };
      if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
      if (opts.body && typeof opts.body === 'object' && !(opts.body instanceof FormData)) {
        headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(opts.body);
      }
      const res = await fetch(API + path, { ...opts, headers });
      if (res.status === 401) {
        logout(false);
        throw new Error('Session expired');
      }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    function toast(msg, type = 'info') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast ' + (type === 'error' ? 'bg-red-600' : type === 'success' ? 'bg-emerald-600' : 'bg-slate-800');
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 2800);
    }

    function logout(call = true) {
      state.token = null;
      state.user = null;
      localStorage.removeItem('jc_token');
      localStorage.removeItem('jc_user');
      render();
    }

    async function init() {
      if (state.token) {
        try {
          state.user = await api('/api/auth/me');
          localStorage.setItem('jc_user', JSON.stringify(state.user));
        } catch {
          logout(false);
        }
      }
      render();
    }

    // ---------- RENDER ----------
    function render() {
      const app = document.getElementById('app');
      if (!state.user) {
        app.innerHTML = renderLogin();
        bindLogin();
        setModalScrollLock(false);
        return;
      }
      app.innerHTML = `
        <div class="flex flex-col min-h-screen">
          ${renderHeader()}
          <main class="flex-1 p-3 sm:p-4 max-w-6xl mx-auto w-full pb-36">
            ${renderView()}
          </main>

          ${renderBottomNav()}
        </div>
        ${state.modal ? renderModal() : ''}
      `;
      bindGlobal();
      setModalScrollLock(!!state.modal);
    }

    function renderLogin() {
      return `
        <div class="min-h-screen flex flex-col items-center justify-center bg-gradient-to-b from-brand-50 to-white p-4">
          <div class="w-full max-w-sm">
            <div class="text-center mb-8">
              <img src="/logo.png" alt="Contact Computers" class="mx-auto h-24 object-contain mb-4 drop-shadow-sm" />
              <p class="text-brand-700 font-medium text-sm tracking-wide">Job Management System</p>
            </div>
            <div class="card p-6">
              <h1 class="text-lg font-semibold text-center mb-5 text-slate-800">Sign in</h1>
              <form id="login-form" class="space-y-4">
                <div>
                  <label class="label">Username</label>
                  <input type="text" name="username" class="input" autocomplete="username" required autofocus />
                </div>
                <div>
                  <label class="label">Password</label>
                  <div class="relative">
                    <input type="password" name="password" id="login-password" class="input pr-16" autocomplete="current-password" required />
                    <button type="button" onclick="toggleLoginPassword()" class="absolute right-2 top-1/2 -translate-y-1/2 text-xs text-brand-600">Show</button>
                  </div>
                </div>
                <button type="submit" class="btn btn-primary w-full py-2.5">Sign in</button>
              </form>
              <p id="login-error" class="text-red-600 text-sm mt-3 text-center hidden"></p>
            </div>
            <p class="text-center text-xs text-slate-400 mt-6">© Contact Computers — How I.T's Done</p>
          </div>
        </div>
      `;
    }

    function bindLogin() {
      document.getElementById('login-form').onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const err = document.getElementById('login-error');
        err.classList.add('hidden');
        try {
          const data = await api('/api/auth/login', {
            method: 'POST',
            body: { username: fd.get('username'), password: fd.get('password') }
          });
          state.token = data.token;
          state.user = data.user;
          localStorage.setItem('jc_token', data.token);
          localStorage.setItem('jc_user', JSON.stringify(data.user));
          state.view = 'dashboard';
          toast('Welcome, ' + data.user.name, 'success');
          render();
        } catch (ex) {
          err.textContent = ex.message;
          err.classList.remove('hidden');
        }
      };
    }

    function renderHeader() {
      const titles = {
        dashboard: 'Dashboard',
        jobs: 'Job Cards',
        jobDetail: 'Job Details',
        calendar: 'Calendar',
        customers: 'Customers',
        deliveries: 'Deliveries & Collections',
        fuel: 'Fuel Log',
        users: 'Users & Roles',
        audit: 'Audit Trail'
      };
      return `
        <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
          <div class="max-w-6xl mx-auto px-3 sm:px-4 h-14 flex items-center justify-between">
            <div class="flex items-center gap-2">
              <img src="/logo.png" alt="" class="h-8 object-contain hidden sm:block" />
              <span class="font-semibold text-brand-700 text-sm sm:text-base">${titles[state.view] || 'JobCard Ops'}</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-xs text-slate-500 hidden sm:inline">${state.user.name} · ${state.user.role}</span>
              <button onclick="logout()" class="btn btn-secondary text-xs py-1.5">Logout</button>
            </div>
          </div>
        </header>
      `;
    }

    function renderBottomNav() {
      const items = [
        { id: 'dashboard', label: 'Home', icon: '⌂' },
        { id: 'jobs', label: 'Jobs', icon: '📋' },
        { id: 'calendar', label: 'Calendar', icon: '📅' },
        { id: 'fuel', label: 'Fuel', icon: '⛽' },
        { id: 'more', label: 'More', icon: '☰' }
      ];
      return `
        <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 safe-bottom z-40">
          <div class="max-w-6xl mx-auto flex justify-around">
            ${items.map(i => `
              <button onclick="navTo('${i.id}')" class="flex-1 py-2 flex flex-col items-center gap-0.5 text-xs ${state.view === i.id || (i.id==='more' && ['deliveries','customers','users','audit'].includes(state.view)) ? 'text-brand-600 font-semibold' : 'text-slate-500'}">
                <span class="text-lg leading-none">${i.icon}</span>
                ${i.label}
              </button>
            `).join('')}
          </div>
        </nav>
      `;
    }

    window.navTo = (id) => {
      if (id === 'more') {
        state.modal = { type: 'more' };
      } else {
        state.view = id;
        state.selectedJob = null;
        state.modal = null;
      }
      render();
      if (['dashboard','jobs','calendar','customers','deliveries','fuel','users','audit'].includes(id)) loadViewData();
    };

    function renderView() {
      switch (state.view) {
        case 'dashboard': return renderDashboard();
        case 'jobs': return renderJobs();
        case 'jobDetail': return renderJobDetail();
        case 'calendar': return renderCalendar();
        case 'customers': return renderCustomers();
        case 'deliveries': return renderDeliveries();
        case 'fuel': return renderFuel();
        case 'users': return renderUsers();
        case 'audit': return renderAudit();
        default: return renderDashboard();
      }
    }

    // ---------- DASHBOARD ----------
    function renderDashboard() {
      const d = state.data.dashboard || {};
      return `
        <div class="space-y-4">
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
            ${statCard('Open Jobs', d.openJobs ?? '—', 'brand')}
            ${statCard('Overdue Tasks', d.overdueTasks ?? '—', 'red')}
            ${statCard('Pending Tasks', d.pendingTasks ?? '—', 'amber')}
            ${statCard('Closed Jobs', d.closedJobs ?? '—', 'emerald')}
            ${statCard('Deliveries', d.deliveries ?? '—', 'sky')}
            ${statCard('Fuel Spend', 'R ' + (d.fuelSpend ?? 0).toFixed(0), 'slate')}
          </div>
          <div class="card p-4">
            <div class="flex items-center justify-between mb-3">
              <h2 class="font-semibold text-sm">Recent Job Cards</h2>
              <button onclick="navTo('jobs')" class="text-brand-600 text-xs font-medium">View all</button>
            </div>
            <div class="space-y-2">
              ${(d.recentJobs || []).length === 0 ? '<p class="text-sm text-slate-400">No jobs yet</p>' :
                d.recentJobs.map(j => `
                  <button onclick="openJob('${j.id}')" class="w-full text-left flex items-center justify-between p-2 rounded-lg hover:bg-slate-50 border border-transparent hover:border-slate-100">
                    <div>
                      <span class="font-medium text-sm">${j.jobNumber}</span>
                      <span class="text-xs text-slate-500 ml-2">${j.customerName || j.siteLocation || ''}</span>
                    </div>
                    <span class="text-xs px-2 py-0.5 rounded-full status-${j.status}">${j.status.replace('_',' ')}</span>
                  </button>
                `).join('')}
            </div>
          </div>
          <div class="flex gap-2">
            <button onclick="openNewJob()" class="btn btn-primary flex-1">+ New Job Card</button>
            <button onclick="navTo('calendar')" class="btn btn-secondary flex-1">Calendar</button>
          </div>
        </div>
      `;
    }

    function statCard(label, value, color) {
      const colors = { brand:'text-brand-700 bg-brand-50', red:'text-red-700 bg-red-50', amber:'text-amber-700 bg-amber-50', emerald:'text-emerald-700 bg-emerald-50', sky:'text-sky-700 bg-sky-50', slate:'text-slate-700 bg-slate-100' };
      return `<div class="card p-3 ${colors[color] || ''}"><div class="text-2xl font-bold">${value}</div><div class="text-xs opacity-80 mt-0.5">${label}</div></div>`;
    }

    // ---------- JOBS ----------
    function renderJobs() {
      const jobs = state.data.jobs || [];
      const filter = state.filters.jobStatus || '';
      const filtered = filter ? jobs.filter(j => j.status === filter) : jobs;
      return `
        <div class="space-y-3">
          <div class="flex flex-wrap gap-2 items-center">
            <input type="search" id="job-search" placeholder="Search jobs..." class="input flex-1 min-w-[140px]" value="${state.filters.jobQ || ''}" />
            <select id="job-status-filter" class="input w-auto">
              <option value="">All status</option>
              <option value="open" ${filter==='open'?'selected':''}>Open</option>
              <option value="in_progress" ${filter==='in_progress'?'selected':''}>In Progress</option>
              <option value="closed" ${filter==='closed'?'selected':''}>Closed</option>
            </select>
            <button onclick="openNewJob()" class="btn btn-primary">+ New</button>
          </div>
          <div class="space-y-2" id="jobs-list">
            ${filtered.length === 0 ? '<p class="text-sm text-slate-400 text-center py-8">No job cards found</p>' :
              filtered.map(j => `
                <button onclick="openJob('${j.id}')" class="card p-3 w-full text-left hover:border-brand-300 transition">
                  <div class="flex justify-between items-start">
                    <div>
                      <div class="font-semibold text-brand-800">${j.jobNumber}</div>
                      <div class="text-sm text-slate-600 mt-0.5">${j.customerName || 'No customer'} · ${j.siteLocation || 'No site'}</div>
                      <div class="text-xs text-slate-400 mt-1 truncate">${j.description || ''}</div>
                    </div>
                    <div class="text-right shrink-0 ml-2">
                      <span class="text-xs px-2 py-0.5 rounded-full status-${j.status}">${j.status.replace('_',' ')}</span>
                      <div class="text-xs mt-1 priority-${j.priority}">${j.priority}</div>
                    </div>
                  </div>
                </button>
              `).join('')}
          </div>
        </div>
      `;
    }

    window.openNewJob = async () => {
      try {
        if (!state.data.customers) state.data.customers = await api('/api/customers');
        state.data.vehicles = await api('/api/vehicles');
        state.data.staff = await api('/api/staff');
      } catch (_) {}
      state.modal = { type: 'newJob' };
      render();
    };

        window.openJob = async (id) => {
      try {
        state.selectedJob = await api('/api/jobs/' + id);
        try {
          state.data.vehicles = await api('/api/vehicles');
          state.data.staff = await api('/api/staff');
        } catch (_) {}
        state.view = 'jobDetail';
        render();
      } catch (e) { toast(e.message, 'error'); }
    };

    function splitTime(t) {
      if (!t || typeof t !== 'string') return { h: '', m: '' };
      const p = t.split(':');
      return { h: p[0] || '', m: (p[1] || '').slice(0, 2) };
    }
    function timeSelectHtml(prefix, value) {
      const { h, m } = splitTime(value);
      const hours = Array.from({ length: 24 }, (_, i) => String(i).padStart(2, '0'));
      // Full 1-minute accuracy 00–59
      const mins = Array.from({ length: 60 }, (_, i) => String(i).padStart(2, '0'));
      const hOpts = '<option value="">HH</option>' + hours.map(x =>
        `<option value="${x}" ${h === x ? 'selected' : ''}>${x}</option>`).join('');
      const mm = (m || '').padStart(2, '0');
      const mOpts = '<option value="">MM</option>' + mins.map(x =>
        `<option value="${x}" ${mm === x ? 'selected' : ''}>${x}</option>`).join('');
      return `
        <div class="flex gap-1 items-center">
          <select name="${prefix}H" class="input flex-1" onchange="syncScopeTimesFromSelects()">${hOpts}</select>
          <span class="font-bold text-slate-400">:</span>
          <select name="${prefix}M" class="input flex-1" onchange="syncScopeTimesFromSelects()">${mOpts}</select>
        </div>`;
    }

    function hoursSpentFromTimes(timeIn, timeOut) {
      if (!timeIn || !timeOut) return null;
      const parse = (s) => {
        const p = String(s).split(':');
        if (p.length < 2) return null;
        const h = Number(p[0]), m = Number(p[1]);
        if (Number.isNaN(h) || Number.isNaN(m)) return null;
        return h * 60 + m;
      };
      let a = parse(timeIn), b = parse(timeOut);
      if (a == null || b == null) return null;
      // overnight: e.g. 22:00 -> 01:30
      if (b < a) b += 24 * 60;
      const mins = b - a;
      const hours = Math.floor(mins / 60);
      const minutes = mins % 60;
      const decimal = Math.round((mins / 60) * 100) / 100;
      return { mins, hours, minutes, decimal, label: hours + 'h ' + String(minutes).padStart(2, '0') + 'm (' + decimal + ' hrs)' };
    }

    async function ensureJobLookups() {
      try {
        if (!state.data.vehicles) state.data.vehicles = await api('/api/vehicles');
        if (!state.data.staff) state.data.staff = await api('/api/staff');
      } catch (_) {}
    }

        function renderJobDetail() {
      const j = state.selectedJob;
      if (!j) return '<p>Loading...</p>';
      const canClose = j.status !== 'closed';
      return `
        <div class="space-y-4">
          <div class="flex items-center justify-between gap-2 flex-wrap">
            <button onclick="state.view='jobs';render()" class="text-brand-600 text-sm">← Back to jobs</button>
            <div class="flex gap-2">
              <button type="button" onclick="exportJobPdf()" class="btn btn-primary text-xs py-2 px-3">Export PDF</button>
              ${(state.user && ['admin','office','field'].includes(state.user.role)) ? `
                <button type="button" onclick="deleteJob()" class="btn btn-danger text-xs py-2 px-3">Delete</button>
              ` : ''}
            </div>
          </div>
          <div class="card p-4">
            <div class="flex justify-between items-center mb-3">
              <div>
                <h2 class="text-xl font-bold text-brand-800">${j.jobNumber}</h2>
                <span class="text-xs px-2 py-0.5 rounded-full status-${j.status}">${j.status.replace('_',' ')}</span>
              </div>
              <div class="flex items-center gap-2">
                <span class="text-sm priority-${j.priority}">${j.priority} priority</span>
                ${canClose ? `<button type="button" onclick="state.modal={type:'editJobDetails',id:'${j.id}'};render()" class="btn btn-primary text-xs py-1">Edit details</button>` : ''}
              </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm">
              <div><span class="text-slate-500">Customer:</span> ${j.customerName || '—'}</div>
              <div><span class="text-slate-500">Site:</span> ${j.siteLocation || '—'}</div>
              <div><span class="text-slate-500">Start:</span> ${j.startDate || '—'}</div>
              <div><span class="text-slate-500">Complete:</span> ${j.completionDate || '—'}</div>
              <div><span class="text-slate-500">Vehicle:</span> ${j.vehicle || '—'}</div>
              <div><span class="text-slate-500">Technician:</span> ${j.technician || '—'}</div>
            </div>
            <p class="text-sm mt-3 text-slate-700">${j.description || ''}</p>
            ${j.notes ? `<p class="text-xs text-slate-500 mt-2">Notes: ${j.notes}</p>` : ''}
            <div class="flex flex-wrap gap-2 mt-3">
              ${canClose ? `<button type="button" onclick="state.modal={type:'editJobMeta',id:'${j.id}'};render()" class="btn btn-secondary text-xs">Vehicle / technician</button>` : ''}
              ${!canClose && (state.user && ['admin','office','field'].includes(state.user.role)) ? `<button type="button" onclick="reopenJob()" class="btn btn-primary text-xs">Reopen job card</button>` : ''}
            </div>
          </div>

          <!-- Job Scope -->
          <div class="card p-4">
            <div class="flex justify-between items-center mb-2">
              <h3 class="font-semibold text-sm">Job Scope</h3>
              ${canClose ? `<button type="button" onclick="state.modal={type:'editJobScope',id:'${j.id}'};render()" class="btn btn-primary text-xs py-1">Edit Scope</button>` : ''}
            </div>
            <div class="space-y-2 text-sm">
              <div><span class="text-slate-500">Work carried out:</span><div class="mt-0.5 whitespace-pre-wrap">${j.workCarriedOut || '—'}</div></div>
              <div class="grid grid-cols-2 gap-2">
                <div><span class="text-slate-500">Time in:</span> ${j.timeIn || '—'}</div>
                <div><span class="text-slate-500">Time out:</span> ${j.timeOut || '—'}</div>
              </div>

    // ---------- CALENDAR ----------
    function renderCalendar() {
      const tasks = state.data.tasks || [];
      const month = state.calendarMonth;
      const year = month.getFullYear();
      const m = month.getMonth();
      const first = new Date(year, m, 1);
      const startDay = first.getDay();
      const daysInMonth = new Date(year, m + 1, 0).getDate();
      const today = new Date().toISOString().slice(0, 10);
      const monthName = month.toLocaleString('default', { month: 'long', year: 'numeric' });

      let cells = '';
      for (let i = 0; i < startDay; i++) cells += '<div class="day-cell bg-slate-50"></div>';
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${year}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const dayTasks = tasks.filter(t => t.dueDate === dateStr);
        cells += `
          <div class="day-cell border border-slate-100 p-1 ${dateStr===today?'bg-brand-50':''}" data-date="${dateStr}"
               ondragover="event.preventDefault()" ondrop="dropTask(event, '${dateStr}')">
            <div class="text-xs font-medium ${dateStr===today?'text-brand-700':''}">${d}</div>
            ${dayTasks.map(t => `
              <div class="task-chip bg-brand-100 text-brand-800" draggable="true"
                   ondragstart="dragTask(event, '${t.id}')" onclick="openJob('${t.jobId}')"
                   title="${t.title}">
                ${t.jobNumber || ''} ${t.title}
              </div>
            `).join('')}
          </div>`;
      }

      return `
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <button onclick="calNav(-1)" class="btn btn-secondary text-sm">‹</button>
            <h2 class="font-semibold">${monthName}</h2>
            <button onclick="calNav(1)" class="btn btn-secondary text-sm">›</button>
          </div>
          <div class="grid grid-cols-7 gap-px bg-slate-200 rounded-lg overflow-hidden text-center text-xs font-medium text-slate-500">
            ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => `<div class="bg-slate-100 py-1">${d}</div>`).join('')}
          </div>
          <div id="calendar-grid" class="grid grid-cols-7 gap-px bg-slate-200 rounded-lg overflow-hidden bg-white">
            ${cells}
          </div>
          <p class="text-xs text-slate-400 text-center">Drag tasks to reschedule · Tap to open job</p>
        </div>
      `;
    }

    window.calNav = (dir) => {
      state.calendarMonth = new Date(state.calendarMonth.getFullYear(), state.calendarMonth.getMonth() + dir, 1);
      render();
    };
    window.dragTask = (e, id) => { e.dataTransfer.setData('taskId', id); };
    window.dropTask = async (e, date) => {
      e.preventDefault();
      const id = e.dataTransfer.getData('taskId');
      if (!id) return;
      try {
        await api('/api/tasks/' + id, { method: 'PUT', body: { dueDate: date } });
        toast('Task moved to ' + date, 'success');
        loadViewData();
      } catch (err) { toast(err.message, 'error'); }
    };

    // ---------- DELIVERIES ----------
    function esc(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    // value for <input type="datetime-local"> in the user's LOCAL time
    function toLocalInput(iso) {
      const d = iso ? new Date(iso) : new Date();
      if (isNaN(d)) return '';
      const p = n => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
    }
    function findDelivery(id) {

    // ---------- FUEL ----------
    function findFuel(id) {
      return (state.data.fuel || []).find(x => x.id === id);
    }

    function renderFuel() {
      const list = state.data.fuel || [];
      const now = new Date();
      if (!state.fuelMonth) state.fuelMonth = now.toISOString().slice(0, 7);
      const [selY, selM] = String(state.fuelMonth).split('-').map(Number);
      const selDate = new Date(selY, (selM || 1) - 1, 1);
      const monthName = selDate.toLocaleString(undefined, { month: 'short', year: 'numeric' });
      const isCurrent = selY === now.getFullYear() && (selM - 1) === now.getMonth();

      const totalAmt = list.reduce((s, f) => s + (Number(f.amount) || 0), 0);
      const totalL = list.reduce((s, f) => s + (Number(f.litres) || 0), 0);
      const monthList = list.filter(f => {
        const d = new Date(f.dateTime);
        return d.getFullYear() === selY && (d.getMonth() + 1) === selM;
      });
      const monthAmt = monthList.reduce((s, f) => s + (Number(f.amount) || 0), 0);
      const monthL = monthList.reduce((s, f) => s + (Number(f.litres) || 0), 0);
      const avgPrice = totalL > 0 ? totalAmt / totalL : null;
      const monthAvg = monthL > 0 ? monthAmt / monthL : null;

      const odos = monthList.map(f => Number(f.odometer)).filter(n => !Number.isNaN(n) && n > 0).sort((a, b) => a - b);
      const odoSpan = odos.length >= 2 ? (odos[odos.length - 1] - odos[0]) : null;
      const last = monthList[0] || list[0];

      const payMap = {};
      monthList.forEach(f => {
        const k = f.paymentMethod || 'Unspecified';
        payMap[k] = (payMap[k] || 0) + (Number(f.amount) || 0);
      });
      const paySummary = Object.keys(payMap).length
        ? Object.entries(payMap).map(([k, v]) => k + ': R ' + v.toFixed(0)).join(' · ')
        : '—';

      // Months that have data, plus current
      const monthSet = new Set();
      monthSet.add(now.toISOString().slice(0, 7));
      list.forEach(f => {
        const d = new Date(f.dateTime);
        if (!isNaN(d)) monthSet.add(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'));
      });
      const monthOptions = [...monthSet].sort().reverse().map(key => {
        const [yy, mm] = key.split('-').map(Number);
        const label = new Date(yy, mm - 1, 1).toLocaleString(undefined, { month: 'long', year: 'numeric' });
        return `<option value="${key}" ${key === state.fuelMonth ? 'selected' : ''}>${label}</option>`;
      }).join('');

      const tile = (label, value, sub) => `
        <div class="card p-3 min-w-0">
          <div class="text-[11px] uppercase tracking-wide text-slate-500">${label}</div>
          <div class="text-lg font-bold text-brand-900 truncate">${value}</div>
          ${sub ? `<div class="text-[11px] text-slate-400 mt-0.5 truncate">${sub}</div>` : ''}
        </div>`;

      return `
        <div class="space-y-3">
          <div class="card p-3 flex flex-wrap items-center gap-2">
            <label class="text-sm font-medium text-slate-600">Month</label>
            <select class="input flex-1 min-w-[160px]" onchange="setFuelMonth(this.value)">
              ${monthOptions}
            </select>
            <button type="button" onclick="exportFuelMonthPdf(state.fuelMonth)" class="btn btn-secondary text-xs whitespace-nowrap">Download ${monthName} report</button>
          </div>

          <div class="grid grid-cols-2 gap-2">
            ${tile(isCurrent ? 'This month' : monthName, 'R ' + monthAmt.toFixed(2), monthList.length + ' fill-up' + (monthList.length === 1 ? '' : 's'))}
            ${tile('Month litres', (monthL ? monthL.toFixed(1) : '0') + ' L', monthAvg != null ? 'Avg R ' + monthAvg.toFixed(2) + '/L' : '—')}
            ${tile('All time', 'R ' + totalAmt.toFixed(2), list.length + ' total entries')}
            ${tile('All litres', (totalL ? totalL.toFixed(1) : '0') + ' L', avgPrice != null ? 'Avg R ' + avgPrice.toFixed(2) + '/L' : '—')}
          </div>

          <div class="card p-3 space-y-1.5 text-sm">
            <div class="flex justify-between gap-2">
              <span class="text-slate-500">Last fill-up${isCurrent ? '' : ' in month'}</span>
              <span class="font-medium text-right">${last && monthList.length ? (new Date(last.dateTime).toLocaleDateString() + ' · R ' + (Number(last.amount) || 0).toFixed(2) + (last.litres != null ? ' · ' + last.litres + ' L' : '')) : '—'}</span>
            </div>
            <div class="flex justify-between gap-2">
              <span class="text-slate-500">Last vehicle</span>
              <span class="font-medium text-right">${last && monthList.length ? esc(last.vehicle || '—') + (last.station ? ' @ ' + esc(last.station) : '') : '—'}</span>
            </div>
            <div class="flex justify-between gap-2">
              <span class="text-slate-500">Odometer range</span>
              <span class="font-medium text-right">${odoSpan != null ? odos[0] + ' → ' + odos[odos.length - 1] + ' km (' + odoSpan + ' km)' : (odos.length === 1 ? odos[0] + ' km' : '—')}</span>
            </div>
            <div class="flex justify-between gap-2">
              <span class="text-slate-500">Paid this month</span>
              <span class="font-medium text-right text-xs sm:text-sm">${esc(paySummary)}</span>
            </div>
          </div>

          <div class="flex gap-2">
            <button type="button" onclick="state.modal={type:'newFuel'};render()" class="btn btn-primary flex-1">+ Log Fuel</button>
            <button type="button" onclick="exportFuelMonthPdf(state.fuelMonth)" class="btn btn-secondary flex-1 text-xs">Download report</button>
          </div>

          <div class="text-xs font-semibold text-slate-500 uppercase tracking-wide px-0.5">Entries for ${monthName}</div>
          <div class="space-y-2">
            ${monthList.length === 0 ? '<p class="text-sm text-slate-400 text-center py-8">No fuel logs for this month</p>' :
              monthList.map(f => `
                <div class="card p-3 cursor-pointer active:bg-slate-50" onclick="state.modal={type:'viewFuel',id:'${f.id}'};render()">
                  <div class="flex justify-between gap-2">
                    <div class="min-w-0">
                      <div class="font-medium text-sm">${esc(f.ref || '')} · ${esc(f.vehicle)} ${f.registration ? '('+esc(f.registration)+')' : ''}</div>
                      <div class="text-xs text-slate-500">${f.litres || '—'} L · ${esc(f.fuelType)} · R ${f.amount || 0}${f.paymentMethod ? ' · ' + esc(f.paymentMethod) : ''}</div>
                      <div class="text-xs text-slate-400">${esc(f.station || '')} · ${esc(f.driver || '')} · ${new Date(f.dateTime).toLocaleString()}</div>
                      ${f.odometer ? `<div class="text-xs text-slate-400">Odo: ${f.odometer} km</div>` : ''}
                      <div class="text-xs text-brand-600 mt-1">View · Edit · PDF ›</div>
                    </div>
                    ${f.receiptData || f.receipt ? `<img src="${f.receiptData || f.receipt}" class="w-12 h-12 object-cover rounded border shrink-0" />` : ''}
                  </div>
                </div>
              `).join('')}
          </div>
        </div>
      `;
    }

    function setModalScrollLock(locked) {
      const body = document.body;
      const html = document.documentElement;
      if (locked) {
        if (!body.classList.contains('modal-open')) {
          _scrollY = window.scrollY || window.pageYOffset || 0;

    // ---------- Signature ----------
    let sigPad = null;
    let sigObserver = null;
    let sigSaving = false;
    function initSigPad(canvas) {
      const ctx = canvas.getContext('2d');
      let drawing = false;
      let hasInk = false;

      // Size the drawing bitmap to the box's real on-screen size (device pixels)
      const setup = () => {
        const r = canvas.getBoundingClientRect();
        if (r.width < 2 || r.height < 2) return false; // not laid out yet
        const ratio = Math.max(window.devicePixelRatio || 1, 1);
        const w = Math.round(r.width * ratio), h = Math.round(r.height * ratio);
        if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.strokeStyle = '#1e3a8a';
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        return true;
      };
      setup();

      // Finger position -> bitmap coordinates (stays correct even if CSS size and bitmap size differ)
      const pos = (e) => {
        const r = canvas.getBoundingClientRect();
        const t = e.touches && e.touches[0] ? e.touches[0] : e;
        return {
          x: (t.clientX - r.left) * (canvas.width / r.width),
          y: (t.clientY - r.top) * (canvas.height / r.height),
          k: canvas.width / r.width
        };
      };
      const start = (e) => {
        e.preventDefault();
        if (canvas.width < 2) setup();
        drawing = true;
        hasInk = true;
        const p = pos(e);
        ctx.lineWidth = 2.5 * p.k;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x + 0.01, p.y + 0.01); // lets a single tap leave a dot
        ctx.stroke();
      };
      const move = (e) => { if (!drawing) return; e.preventDefault(); const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };
      const end = () => { drawing = false; };
      canvas.addEventListener('mousedown', start);
      canvas.addEventListener('mousemove', move);
      canvas.addEventListener('mouseup', end);
      canvas.addEventListener('mouseleave', end);
      canvas.addEventListener('touchstart', start, { passive: false });
      canvas.addEventListener('touchmove', move, { passive: false });
      canvas.addEventListener('touchend', end);
      canvas.addEventListener('touchcancel', end);

      // Re-size when the layout settles / phone rotates / keyboard opens (only while still blank)
      if (sigObserver) sigObserver.disconnect();
      if ('ResizeObserver' in window) {
        sigObserver = new ResizeObserver(() => { if (!hasInk) setup(); });
        sigObserver.observe(canvas);
      }

      sigPad = {
        canvas,
        ctx,
        get hasInk() { return hasInk; },
        clear: () => { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.restore(); hasInk = false; setup(); }
      };
    }

    // Crop to the pen strokes (with padding) on a white background; returns null if nothing was drawn
    function exportSigData(canvas) {
      const { width, height } = canvas;
      const px = canvas.getContext('2d').getImageData(0, 0, width, height).data;
      let minX = width, minY = height, maxX = -1, maxY = -1;
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          if (px[(y * width + x) * 4 + 3] > 0) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (maxX < 0) return null;
      const pad = 24;
      const sx = Math.max(0, minX - pad), sy = Math.max(0, minY - pad);
      const sw = Math.min(width, maxX + pad) - sx, sh = Math.min(height, maxY + pad) - sy;
      const c = document.createElement('canvas');
      c.width = sw;
      c.height = sh;
      const cx = c.getContext('2d');
      cx.fillStyle = '#ffffff';
      cx.fillRect(0, 0, sw, sh);
      cx.drawImage(canvas, sx, sy, sw, sh, 0, 0, sw, sh);
      return c.toDataURL('image/png');
    }

    window.exportFuelPdf = async (id) => {
      const f = findFuel(id);
      if (!f) return;
      if (!window.jspdf) { toast('PDF library still loading', 'error'); return; }
      try {
        toast('Building PDF…');
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit: 'mm', format: 'a4' });
        const margin = 16;
        let y = await drawCompanyPdfHeader(doc, 'Fuel Log Entry');

        // Ref + date
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(16);
        doc.setTextColor(15, 23, 42);
        doc.text(String(f.ref || 'Fuel'), margin, y);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9);
        doc.setTextColor(100, 116, 139);

    function resizeImageForUpload(file) {
      return new Promise(function(resolve, reject) {
        var url = URL.createObjectURL(file);
        var img = new Image();
        var done = false;
        var timer = setTimeout(function() {
          if (done) return;
          done = true;
          URL.revokeObjectURL(url);
          // last resort: raw base64 (may fail if huge)
          fileToBase64(file).then(resolve).catch(reject);
        }, 15000);
        img.onload = function() {
          if (done) return;
          try {
            var maxSide = 1200;
            var w = img.naturalWidth || img.width || 1;
            var h = img.naturalHeight || img.height || 1;
            if (w > maxSide || h > maxSide) {
              var scale = maxSide / Math.max(w, h);
              w = Math.max(1, Math.round(w * scale));
              h = Math.max(1, Math.round(h * scale));
            }
            var c = document.createElement('canvas');
            c.width = w;
            c.height = h;
            var ctx = c.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            var data = c.toDataURL('image/jpeg', 0.7);
            done = true;
            clearTimeout(timer);
            URL.revokeObjectURL(url);
            if (!data || data.length < 50) reject(new Error('Could not process image'));
            else resolve(data);
          } catch (err) {
            done = true;
            clearTimeout(timer);
            URL.revokeObjectURL(url);
            reject(err);
          }
        };
        img.onerror = function() {
          if (done) return;
          done = true;
          clearTimeout(timer);
          URL.revokeObjectURL(url);
          fileToBase64(file).then(resolve).catch(function() {
            reject(new Error('This image format is not supported. Try a different photo.'));
          });
        };
        img.src = url;
      });
    }

    async function drawCompanyPdfHeader(doc, subtitle) {

    function pdfEnsureSpace(doc, y, need, margin) {
      if (y + need > 278) {
        doc.addPage();
        // thin top accent on continuation pages
        doc.setFillColor(37, 99, 235);
        doc.rect(0, 0, 210, 1.2, 'F');
        return 16;
      }
      return y;
    }

    function pdfSectionTitle(doc, title, y, margin) {
      y = pdfEnsureSpace(doc, y, 12, margin);
      doc.setFillColor(37, 99, 235);
      doc.roundedRect(margin, y - 4, 2.2, 6, 0.5, 0.5, 'F');
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(11);
      doc.setTextColor(30, 41, 59);
      doc.text(title, margin + 5, y);
      return y + 7;
    }

    function pdfKV(doc, label, value, y, margin, colWidth) {
      const labelW = 38;
      const val = String(value == null || value === '' ? '—' : value);
      const lines = doc.splitTextToSize(val, colWidth - labelW - 2);
      const h = Math.max(5, lines.length * 4.2);
      y = pdfEnsureSpace(doc, y, h + 1, margin);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(8);
      doc.setTextColor(100, 116, 139);
      doc.text(label, margin, y);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9.5);
      doc.setTextColor(15, 23, 42);
      doc.text(lines, margin + labelW, y);
      return y + h;
    }

    function pdfBodyText(doc, text, y, margin, size) {
      size = size || 9.5;
      const lines = doc.splitTextToSize(String(text || '—'), 178);
      const h = lines.length * (size * 0.42) + 1;
      y = pdfEnsureSpace(doc, y, h, margin);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(size);
      doc.setTextColor(30, 41, 59);
      doc.text(lines, margin, y);
      return y + h;
    }

    function pdfFooter(doc) {
      const pages = doc.internal.getNumberOfPages();
      for (let i = 1; i <= pages; i++) {
        doc.setPage(i);
        doc.setDrawColor(226, 232, 240);
        doc.setLineWidth(0.3);
        doc.line(16, 287, 194, 287);

      }
    }

        // Description
        y = pdfSectionTitle(doc, 'Description', y, margin);
        y = pdfBodyText(doc, j.description || '—', y, margin);
        if (j.notes) {
          y += 2;
          doc.setFont('helvetica', 'italic');
          doc.setFontSize(8.5);
          doc.setTextColor(100, 116, 139);
          const nlines = doc.splitTextToSize('Notes: ' + j.notes, 178);
          y = pdfEnsureSpace(doc, y, nlines.length * 4 + 2, margin);
          doc.text(nlines, margin, y);
          y += nlines.length * 4 + 2;
        }
        y += 3;

        // Job Scope
        y = pdfSectionTitle(doc, 'Job Scope', y, margin);
        y = pdfKV(doc, 'Work carried out', j.workCarriedOut, y, margin, 178);
        y = pdfKV(doc, 'Time in', j.timeIn, y, margin, 178);
        y = pdfKV(doc, 'Time out', j.timeOut, y, margin, 178);
        const spent = hoursSpentFromTimes(j.timeIn, j.timeOut);
        y = pdfKV(doc, 'Time spent', spent ? spent.label : '—', y, margin, 178);
        y = pdfKV(doc, 'Equipment / Spares', j.equipmentSpares, y, margin, 178);
        y = pdfKV(doc, 'Comments', j.scopeComments, y, margin, 178);
        const ratingTxt = j.jobRating != null ? (String(j.jobRating) + ' / 5') : '—';
        const invTxt = j.hasInvoice ? ('Yes' + (j.invoiceNumber ? '  ·  #' + j.invoiceNumber : '')) : 'No';
        y = pdfKV(doc, 'Rating', ratingTxt, y, margin, 178);
        y = pdfKV(doc, 'Invoice', invTxt, y, margin, 178);
        y += 3;

        // Tasks
        y = pdfSectionTitle(doc, 'Tasks', y, margin);
        const tasks = j.tasks || [];
        if (tasks.length === 0) {
          y = pdfBodyText(doc, 'No tasks', y, margin, 9);
        } else {
          tasks.forEach((t, i) => {
            const row = (i + 1) + '. ' + (t.title || 'Task') + '   [' + (t.status || '') + ']' + (t.dueDate ? '   Due: ' + t.dueDate : '');
            y = pdfBodyText(doc, row, y, margin, 9);
          });
        }
        y += 3;

        // Signature
        y = pdfSectionTitle(doc, 'Customer sign-off', y, margin);
        if (j.signature && (j.signature.data || j.signature.path)) {
          try {
            const img = j.signature.data || await loadImageAsDataUrl(j.signature.path.startsWith('http') ? j.signature.path : (window.location.origin + j.signature.path));
            const sp = doc.getImageProperties(img);
            let sw = 65, sh = (sp.height * sw) / sp.width;
            if (sh > 28) { sh = 28; sw = (sp.width * sh) / sp.height; }
            y = pdfEnsureSpace(doc, y, sh + 14, margin);
            doc.setFillColor(255, 255, 255);
            doc.setDrawColor(203, 213, 225);
            doc.roundedRect(margin, y - 2, sw + 8, sh + 6, 2, 2, 'D');
            doc.addImage(img, img.indexOf('image/jpeg') >= 0 ? 'JPEG' : 'PNG', margin + 4, y, sw, sh);
            y += sh + 8;
            doc.setFontSize(8);
            doc.setTextColor(100, 116, 139);
            doc.text('Signed by: ' + (j.signature.signedBy || 'Customer') + '  ·  ' + new Date(j.signature.signedAt).toLocaleString(), margin, y);
            y += 6;
          } catch {
            y = pdfBodyText(doc, 'Signature on file', y, margin, 9);
          }
        } else {
          y = pdfBodyText(doc, 'No signature captured', y, margin, 9);
        }
        y += 3;

        // Photos
        const photos = j.photos || [];
        y = pdfSectionTitle(doc, 'Photos (' + photos.length + ')', y, margin);
        if (photos.length === 0) {
          y = pdfBodyText(doc, 'No photos attached', y, margin, 9);
        } else {
          for (let i = 0; i < photos.length; i++) {
            const ph = photos[i];
            try {
              const imgData = ph.data || await loadImageAsDataUrl(ph.path.startsWith('http') ? ph.path : (window.location.origin + ph.path));
              const format = imgData.indexOf('image/jpeg') >= 0 ? 'JPEG' : 'PNG';
              const maxW = 178, maxH = 72;
              const props = doc.getImageProperties(imgData);
              let w = maxW, h = (props.height * maxW) / props.width;
              if (h > maxH) { h = maxH; w = (props.width * maxH) / props.height; }
              y = pdfEnsureSpace(doc, y, h + 12, margin);
              doc.setDrawColor(226, 232, 240);
              doc.roundedRect(margin - 1, y - 1, w + 2, h + 2, 1.5, 1.5, 'D');
              doc.addImage(imgData, format, margin, y, w, h);
              y += h + 4;
              doc.setFontSize(7.5);
              doc.setTextColor(148, 163, 184);
              doc.text((ph.type || 'Photo') + (ph.uploadedAt ? '  ·  ' + new Date(ph.uploadedAt).toLocaleString() : ''), margin, y);
              y += 7;
            } catch (err) {
              console.warn('Photo embed failed', ph.path, err);
              y = pdfBodyText(doc, 'Photo ' + (i + 1) + ' could not be embedded', y, margin, 9);
            }
          }
        }

        pdfFooter(doc);
        doc.save((j.jobNumber || 'job') + '.pdf');
        toast('PDF downloaded', 'success');
      } catch (e) {
        console.error(e);
        toast(e.message || 'PDF export failed', 'error');
      }
    };


    function loadImageAsDataUrl(url) {
      return new Promise((resolve, reject) => {
        // Prefer fetch so same-origin uploads work reliably
        fetch(url, { credentials: 'same-origin' })
          .then(r => {
            if (!r.ok) throw new Error('Image fetch failed');
            return r.blob();
          })
          .then(blob => {
            const reader = new FileReader();
            reader.onload = () => {
              // Re-encode via canvas to a reasonable JPEG size for PDF
              const img = new Image();
              img.onload = () => {
                try {
                  const maxSide = 1200;
                  let w = img.width;
                  let h = img.height;
                  if (w > maxSide || h > maxSide) {
                    const scale = maxSide / Math.max(w, h);
                    w = Math.round(w * scale);
                    h = Math.round(h * scale);
                  }
                  const c = document.createElement('canvas');
                  c.width = w;
                  c.height = h;
                  const ctx = c.getContext('2d');
                  ctx.fillStyle = '#ffffff';
                  ctx.fillRect(0, 0, w, h);
                  ctx.drawImage(img, 0, 0, w, h);
                  resolve(c.toDataURL('image/jpeg', 0.85));
                } catch (err) {
                  reject(err);
                }
              };
              img.onerror = reject;
              img.src = reader.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(blob);
          })
          .catch(() => {
            // Fallback: direct Image load
            const img = new Image();
            img.onload = () => {
              try {
                const c = document.createElement('canvas');
                c.width = img.width;
                c.height = img.height;
                c.getContext('2d').drawImage(img, 0, 0);
                resolve(c.toDataURL('image/jpeg', 0.85));
              } catch (err) {
                reject(err);
              }
            };
            img.onerror = reject;
            img.src = url;
          });
      });
    }


    window.doImportCustomers = async () => {

      const text = document.getElementById('import-csv').value.trim();
      if (!text) return;
      const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
      if (lines.length < 2) { toast('Need header + data', 'error'); return; }
      const headers = lines[0].split(',').map(h => h.trim());
      const customers = lines.slice(1).map(line => {
        const vals = line.split(',').map(v => v.trim());
        const obj = {};
        headers.forEach((h, i) => obj[h] = vals[i] || '');
        return obj;
      });
      try {
        const res = await api('/api/customers/import', { method: 'POST', body: { customers } });
        toast(`Imported ${res.imported} customers`, 'success');
        state.modal = null;
        loadViewData();
      } catch (e) { toast(e.message, 'error'); }
    };

    function fileToBase64(file) {
      return new Promise((res, rej) => {
        const reader = new FileReader();
        reader.onload = () => res(reader.result);
        reader.onerror = rej;
        reader.readAsDataURL(file);
      });
    }

    function debounce(fn, ms) {
      let t;
      return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
    }

    async function loadViewData() {
      try {
        if (state.view === 'dashboard') {
          state.data.dashboard = await api('/api/dashboard');
        } else if (state.view === 'jobs') {
          const q = state.filters.jobQ ? '?q=' + encodeURIComponent(state.filters.jobQ) : '';
          state.data.jobs = await api('/api/jobs' + q);
        } else if (state.view === 'calendar') {
          state.data.tasks = await api('/api/tasks');
        } else if (state.view === 'customers') {
          const q = state.filters.custQ ? '?q=' + encodeURIComponent(state.filters.custQ) : '';
          state.data.customers = await api('/api/customers' + q);
        } else if (state.view === 'deliveries') {
          state.data.deliveries = await api('/api/deliveries');
        } else if (state.view === 'fuel') {
          state.data.fuel = await api('/api/fuel');
          state.data.vehicles = await api('/api/vehicles');
        } else if (state.view === 'users') {
          state.data.users = await api('/api/users');
          state.data.vehicles = await api('/api/vehicles');
        } else if (state.view === 'audit') {
          state.data.audit = await api('/api/audit');
        }
        // always keep customers for job form
        if (!state.data.customers) state.data.customers = await api('/api/customers');
        render();
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    // PWA: drop old caches, register new SW
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map(k => caches.delete(k)));
          }
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const r of regs) await r.unregister();
          await navigator.serviceWorker.register('/sw.js?v=3');
        } catch (e) {}
      });
    }

    // boot
    init().then(() => {
      if (state.user) loadViewData();
    });
  </script>
